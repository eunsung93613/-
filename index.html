{id:"boar",a:50,b:500,l:4,r:150,if:s=>s.u.i>3,t:"[03:10] 초소 경계 근무 두 시간째. 철책 아래 수풀이 바스락거리더니 검은 그림자 하나가 이쪽으로 곧장 뛰어온다. 옆 근무자가 숨을 삼키는 소리가 들린다.",c:[
["“정지! 암구호!” 크게 외친다",0,-2,4,"","그림자는 대답 대신 껑충 뛰어 수풀 속으로 사라졌다. 고라니였다. 규정대로 잘했다는 칭찬과 함께, 옆 근무자가 참다 터뜨린 웃음도 들었다."],
["소총에 공포탄을 장전한다",-3,-4,0,"","철컥 소리에 그림자가 우뚝 멈춰 섰다. 고라니였다. 우리는 한참 서로를 쳐다보기만 했다. 교대할 때까지 총을 쥔 손에 땀이 찼다."],
["무전으로 상황실에 보고한다",0,-1,2,"","‘철책 미상 물체 접근’ 보고에 상황실이 한바탕 뒤집혔다. 오분대기조가 출동하고 십 분 뒤 고라니로 판명됐다. 다음 날 아침 행정반 화이트보드에 내 이름 대신 ‘고라니 보고관’이라는 별명이 적혀 있었다."]]},
{id:"cat",a:70,b:500,l:2,v:1,r:9e3,t:"[12:40] 점심을 먹고 들른 PX 뒤편. 라면 박스 안에서 손바닥만 한 새끼 고양이가 운다. 냉동 핫바를 잘게 찢어 박스에 넣어 주는데 등 뒤에서 누가 묻는다. “그게 뭐냐?” PX에서 음료수를 사 들고 나온 {BN} 대대장이다.",c:[
["“길고양이입니다!” 당당히 보고한다",0,3,5,"catm","{BN} 대대장이 박스를 한참 들여다봤다. “이름은?” “없습니다.” “그럼 ‘중령이’다.” 고양이는 그날로 대대 마스코트가 됐고, 사료 값은 대대장 사비로 나왔다."],
["박스를 등 뒤로 슬쩍 숨긴다",0,-4,-4,"","“등 뒤에서 야옹 소리가 나는데.” {BN} 대대장은 박스를 열어 보지도 않고 돌아섰다. 그날 오후 중대에 ‘PX 주변 동물 먹이 주기 금지’ 지시와 함께 경고가 한 장 내려왔다.",0,1],
["“제가 키우겠습니다!” 외친다",0,-2,-2,"","“부대는 동물원이 아니다.” 다음 날 아침 동물보호소 차가 왔다. 빈 박스를 치우고 나서 한동안 PX 뒤편으로 가지 않았다."]]},
{id:"in",a:0,b:0,l:1,t:"[15:00] 논산 육군훈련소 입영심사대. 가족과 헤어진 지 이십 분, 연병장에 줄 선 사백 명 앞에서 {KY} 조교가 확성기도 없이 소리친다. “지금부터 대답은 ‘다’, ‘까’로 끝낸다. 알겠나!”",c:[
["“알겠습니다!” 목청껏 외친다",-3,0,8,"","목이 찢어져라 외쳤다. {KY} 조교가 내 명찰을 들여다보더니 수첩에 뭔가 적었다. 그날 저녁 분대장 훈련병 명단에 내 이름이 올라갔다."],
["입만 벙긋거린다",0,-3,-2,"","“거기 셋째 줄 안경, 한 번 더.” 결국 혼자서 세 번을 더 외쳤다. 사백 명이 전부 내 쪽을 돌아봤다."],
["옆 사람 눈치를 보며 따라 한다",0,0,2,"","옆 사람 입 모양을 보고 반 박자 늦게 따라 외쳤다. 다행히 조교는 앞줄만 보고 있었다."]]},
{id:"ass",a:30,b:30,l:0,t:s=>"[21:40] ["+s.u.n+"] 자대 배치 첫날 밤. 더플백을 다 풀기도 전에 맞선임 {S1:이} 관물대에 팔을 걸치고 묻는다. 생활관 열두 명의 시선이 한꺼번에 쏠린다. “너, 특기가 뭐냐?”",c:[
["“노래입니다.”",0,3,2,"sing","그 자리에서 한 소절을 뽑았다. 박수 반, 야유 반이었다. 그날 밤부터 생활관에서 ‘가수’로 불렸다."],
["“운동입니다.”",3,0,2,"","“오, 내일 족구 한다. 나와.” 대답할 틈도 없이 명단에 내 이름이 적혔다. 그날 밤 종아리를 미리 주물렀다."],
["“컴퓨터입니다.”",-2,0,3,"pc","“잘됐다. 행정반 컴퓨터 또 먹통이다.” 짐도 다 못 푼 채 행정반으로 끌려갔다. 첫 임무는 프린터 드라이버 설치였다."],
["“…없습니다.”",0,2,-3,"","“그럼 청소 잘하겠네.” 생활관에 웃음이 터졌다. 맞는 말이라 대꾸하지 못했다. 다음 날부터 화장실 담당이 됐다."]]},
{id:"cook",a:32,b:300,l:0,r:150,t:"[02:50] 소등한 생활관, 모포 냄새 사이로 라면 냄새가 번진다. 맞선임 {S1:이} 관물대 뒤에 숨어 컵라면을 먹다가 복도 끝 당직사관 발소리에 얼어붙었다. 손전등 불빛 너머로 나와 눈이 마주쳤다.",c:[
["“제가 먹었습니다.” 대신 나선다",0,-5,7,"cover","당직사관은 내 이름을 적고 뒷정리를 시켰다. 다음 날 아침 {S1:이} 작게 말했다. “…고맙다.” 그 뒤로 PX에 갈 때마다 내 몫의 컵라면이 하나씩 늘었다."],
["모포를 덮고 못 본 척 돌아눕는다",0,2,-5,"","{S1:은} 혼자 걸려 새벽 내내 군장을 쌌다. 다음 날 하루 종일 나한테 한마디도 하지 않았다. 차라리 욕을 먹는 편이 나았다."],
["용기를 관물대 밑으로 같이 숨긴다",-2,0,3,"","국물은 관물대 밑에 숨겼다. 냄새는 못 숨겼다. 당직사관은 코를 두 번 킁킁대더니 둘의 이름을 적었다. 새벽 세 시 복도에서 팔굽혀펴기 스무 개, 그리고 경고 한 장.",0,1]]},
{id:"guard",a:20,b:520,l:4,r:60,t:"[02:00] 불침번 근무. 형광등이 반만 켜진 복도에 코 고는 소리만 이어진다. 근무 일지 옆 벽시계 초침이 유난히 느리게 간다. 교대까지 한 시간 이십 분.",c:[
["꼿꼿이 선 채로 버틴다",-3,-2,3,"","벽시계를 백 번쯤 쳐다봤다. 교대자를 깨우고 침상에 눕자 종아리가 저릿저릿했다. 일지엔 ‘특이사항 없음’ 한 줄."],
["벽에 기대 잠깐 눈을 감는다",4,3,-2,"dozed","딱 일 분만 감으려 했다. 고개가 툭 떨어지는 바람에 눈을 떴을 땐 벽시계가 이십 분을 건너뛰어 있었다. 일지에는 그 시간이 비어 있다.",[.45,"dn"]],
["아껴 둔 초코파이를 몰래 뜯는다",-1,5,-1,"","비닐이 바스락거릴 때마다 손을 멈추고 복도 끝을 살폈다. 한 입 베어 물자 졸음이 조금 가셨다.",[.3,"dsg"]]]},
{id:"caught",a:60,b:540,l:0,if:s=>s.f.dozed,t:"[08:10] 아침 점호 직후 행정반. 당직사관이 불침번 근무 일지를 넘기다 한 줄에서 손가락을 멈춘다. “이 날 두 시 사십 분부터 세 시까지, 이십 분이 비는데. 설명해 봐.”",c:[
["“…졸았습니다.” 솔직히 인정한다",0,-3,-2,"","당직사관이 한숨을 쉬었다. “정직한 건 인정한다.” 행정반 청소 일주일로 끝났다. 일주일 내내 걸레를 빨며 그 이십 분을 곱씹었다."],
["화장실에 다녀왔다고 둘러댄다",0,0,0,"",0,0,0,GB(0.4,"“이십 분이나?” 당직사관은 한참 일지를 노려보더니 다음 장으로 넘겼다. 행정반을 나서는 순간 등 뒤로 식은땀이 흘렀다.",[0,1,0],"그 시간 복도 CCTV에 벽에 기대 고개를 떨군 내 모습이 그대로 찍혀 있었다. 거짓말이 하나 더 얹히면서 일이 걷잡을 수 없이 커졌다.",[0,-6,-8,2])]]},
{id:"sick",a:10,b:500,l:0,r:100,t:"[06:20] 기상 음악이 울렸는데 몸이 천근만근이다. 침을 삼킬 때마다 목이 따갑고 이마가 뜨겁다. 오늘은 오전 내내 영점 사격, 오후엔 측정 사격이다.",c:[
["“괜찮습니다.” 참고 사격장에 나간다",-6,-2,3,"","가늠자 너머 표적이 두 개로 겹쳐 보였다. 숨을 참을 때마다 기침이 올라왔다. 스무 발 중 열세 발, 간신히 합격선이었다."],
["분대장에게 말하고 의무대에 간다",5,3,-3,"","군의관은 체온계를 보더니 “감기네.” 한마디로 끝냈다. 하얀 알약 세 개를 받고 의무대 침상에서 두 시간을 잤다. 사격은 다음 주로 미뤄졌다."],
["아무에게도 말하지 않고 버틴다",-4,-3,0,"","버티면 나을 줄 알았다. 저녁 점호 때 다리가 풀려 주저앉았고, 당직사관이 잰 체온계는 삼십구 도를 가리켰다."]]},
{id:"px",a:45,b:530,l:2,r:50,t:"[18:20] 월급날 저녁. 휴대폰에 입금 알림이 뜨자마자 PX 앞 줄이 서른 명을 넘었다. 냉동고 문이 열릴 때마다 하얀 김이 쏟아지고, 계산대 옆 전자레인지 두 대는 쉴 틈이 없다.",c:[
["냉동 만두와 핫바를 한가득 산다",-1,6,0,"","전자레인지 앞에서 기다린 오 분이 하루 중 제일 좋은 오 분이었다. 만두피가 입천장에 들러붙어도 웃음이 났다."],
["생활관 선임들 몫까지 양손 가득 사 온다",0,-2,6,"","봉지 두 개가 손가락을 파고들었다. 체크카드 잔액은 반으로 줄었고, 그날 저녁 생활관에선 내 이름이 한 번씩 더 불렸다."],
["적금 통장에 그대로 넣어 둔다",0,2,0,"","장병내일준비적금 앱을 열어 숫자가 오르는 걸 확인했다. 전역하고 하고 싶은 일 목록에 한 줄을 더 적었다."]]},
{id:"march",a:100,b:440,l:1,r:150,t:"[01:30] 야간 30km 행군, 20km 지점. 군장 끈이 어깨를 파고들고, 오른발 뒤꿈치 물집이 터져 전투화 안이 미끈거린다. 옆에서 걷던 동기 {D1:이} 휘청하더니 내 어깨를 붙잡는다.",c:[
["{D1n}의 군장을 나눠 멘다",-8,2,8,"helper","{D1:이} 숨을 몰아쉬며 웃었다. “야, 너 때문에 산다.” 마지막 5km는 둘이 발을 맞춰 군가를 불렀다. 도착 지점 천막 불빛이 그렇게 반가울 수 없었다."],
["이를 악물고 내 걸음만 걷는다",-4,-2,0,"","앞사람 군장만 보며 걸었다. 도착하고서야 {D1:이} 없다는 걸 알았다. 마지막 10km를 구급차 뒷좌석에서 왔다고 했다."],
["손을 들어 의무병을 부른다",4,3,-4,"","둘 다 구급차에 실렸다. 분대장은 ‘꾀병 아니냐’며 혀를 찼다. 양말을 벗기자 피가 배어 나왔는데도."]]},
{id:"cold",a:100,b:480,l:1,r:300,if:s=>wn(s.d),t:"[05:40] 혹한기 훈련 사흘째 새벽. 영하 십오 도, 텐트 안에서도 입김이 하얗게 얼어붙는다. 지급된 핫팩은 분대에 네 개뿐이고, 밤새 언 전투화 끈은 철사처럼 뻣뻣하다.",c:[
["내 핫팩을 후임 {H1} 주머니에 넣어 준다",-5,3,6,"","{H1:은} 한마디도 못 하고 고개만 숙였다. 그 핫팩이 다 식을 때까지, 훈련 내내 두 손으로 꼭 쥐고 다녔다."],
["내 몫은 내가 쓴다",3,-2,-3,"","핫팩을 전투복 안주머니에 넣었다. 옆에서 손을 비비는 후임들 쪽은 쳐다보지 않았다."],
["핫팩을 모아 분대가 돌려 쓴다",-2,5,4,"","핫팩 네 개를 열 명이 십 분씩 돌려 쥐었다. 마지막 순번이 핫팩을 받자 누가 “이게 핫팩 계주냐.” 해서 다들 웃었다."]]},
{id:"senior",a:120,b:360,l:0,t:"[23:30] 근무 교대 직전, 상황실 옆 복도. 선임 {S2:이} 순찰 일지의 빈칸을 손가락으로 톡톡 두드리며 작게 말한다. 자기가 빼먹은 순찰 시간이다. “이 시간, 네가 돈 걸로 쓰자. 알지?”",c:[
["“그건 아닙니다.” 거절한다",0,4,-6,"rebel","{S2}의 얼굴이 굳었다. “그래, 너 잘났다.” 그 뒤로 한 달 동안, 점호 때마다 내 관물대 각만 유독 자주 지적당했다."],
["빈칸에 내 이름을 쓴다",-2,-10,4,"quiet","{S2:은} 어깨를 툭 치며 고맙다고 했다. 며칠 뒤 감찰에서 그 서명 때문에 경고를 받은 건 나였다.",0,1],
["{PL} 소대장에게 보고한다",0,6,-8,"report","{PL} 소대장은 대답 대신 수첩에 적기만 했다. 일주일 뒤 {S2:은} 다른 중대로 전출됐다. 전출 명령이 나오기도 전에 내가 찔렀다는 소문이 먼저 돌았다."]]},
{id:"leave",a:150,b:480,l:3,r:130,t:"[09:00] 정기 휴가 출발. 위병소에서 휴가증을 확인받고 차단기를 지난다. 터미널행 버스는 십 분 뒤. 나흘 뒤 같은 시각까지 복귀다.",c:[
["집에 가서 푹 쉰다",8,12,0,"","엄마는 하루에 반찬을 세 번 바꿔 내놨다. 내 방 침대에 누워 천장 무늬만 봐도 좋았다. 알람 없이 눈을 뜬 게 몇 달 만이었다."],
["친구들을 불러 밤새 논다",-8,10,2,"late","노래방, 피시방, 포장마차까지 사흘을 달렸다. 마지막 날 새벽 다섯 시에야 눈을 붙였는데, 복귀 버스는 낮 한 시였다."],
["여자친구를 만나러 간다",-2,14,0,"gf","동네 공원 벤치에 앉아 손만 잡고 있었는데 하루가 갔다. 터미널에서 헤어질 땐 일부러 시계를 보지 않았다."]]},
{id:"late",a:150,b:520,l:3,n:1,if:s=>s.f.late,t:"[17:20] 복귀 날 고속도로. 버스가 톨게이트 앞에서 십 분째 꼼짝하지 않는다. 위병소 복귀 마감까지 사십 분, 남은 거리는 삼십 킬로미터. 휴대폰 배터리는 9퍼센트다.",c:[
["다음 휴게소에서 택시로 갈아탄다",0,-2,1,"","미터기 요금이 월급 반쯤까지 올라갔다. 차단기 앞에 내린 건 마감 십 분 전. 위병 근무자가 시계를 보더니 ‘아슬아슬했다’며 웃었다."],
["그래도 버스를 믿고 기다린다",-2,-8,-10,"","고속도로가 끝까지 막혔다. 오 분 지각. 위병 근무자가 복귀 대장에 시간을 적으며 한숨을 쉬었고, 그 한 줄이 그대로 징계 사유가 됐다.",0,2],
["부대에 전화해 사정을 말한다",0,0,-2,"","배터리 9퍼센트로 당직사관에게 전화를 걸었다. “지금 어디냐”는 말만 세 번 들었다. 다행히 늦진 않았지만, 행정반엔 ‘전화 온 놈’으로 기억됐다."]]},
{id:"letter",a:240,b:470,l:0,if:s=>s.f.gf,t:"[19:30] 휴대폰 사용 시간. 화면을 켜자 여자친구에게서 온 긴 메시지가 떠 있다. 미리보기 첫 줄은 “우리 얘기 좀 하자.” 휴대폰 반납까지 한 시간 반 남았다.",c:[
["바로 전화를 건다",0,-8,0,"gfstay","생활관 계단참에 쪼그려 앉아 한 시간 반을 통화했다. 헤어지진 않았다. 휴대폰을 반납할 때 손바닥에 땀이 흥건했다."],
["손편지로 답장을 쓴다",0,-3,0,"gfstay","볼펜으로 편지지 두 장을 꾹꾹 채웠다. 열흘 뒤 행정반 우편함에 답장이 꽂혀 있었다. 봉투 안엔 한 줄. ‘기다릴게.’"],
["담담하게 받아들인다",0,-12,2,"gfgone","끝까지 읽고 “그래.” 한 줄만 보냈다. 프로필 사진이 바뀌는 데 사흘이 걸렸다. 한동안 식판을 다 비우지 못했다."]]},
{id:"tS",a:180,b:440,l:0,if:s=>s.f.sing,t:"[19:00] 대대 장기자랑이 열린 강당. 무대 조명이라곤 손전등 네 개를 테이프로 붙인 게 전부다. 중대 순서가 되자 사회를 보던 선임이 마이크를 내 쪽으로 내민다. “우리 중대 가수, 나와!”",c:[
["마이크를 받아 든다",-2,6,12,"star","첫 소절에서 목이 갈라졌다. 그게 더 웃겼다. 객석에서 휴대폰 플래시가 하나둘 켜지더니 앙코르까지 나왔다. 공연이 끝나고 대대장이 무대 뒤까지 찾아와 이름을 물었다."],
["손사래를 치며 무대 뒤로 도망간다",0,2,-4,"","도망가는 내 뒷모습이 누군가의 휴대폰에 그대로 찍혔다. 다음 날 중대 단톡방에 영상이 올라왔고, 댓글 대신 ‘ㅋ’만 수백 개가 달렸다."]]},
{id:"tP",a:150,b:440,l:0,if:s=>s.f.pc,t:"[16:50] 일과 종료 십 분 전, 행정반 컴퓨터가 파란 화면을 띄우고 멈췄다. 오늘 마감인 휴가 결재 서류가 그 안에 있다. 인사계원이 생활관 문을 벌컥 열고 외친다. “컴퓨터 아는 놈!”",c:[
["“제가 해 보겠습니다.” 손을 든다",-4,-4,9,"","재부팅 한 번, 업데이트 한 번에 살아났다. 휴가 서류는 마감 일 분 전에 출력됐다. 그 뒤로 행정반에서 뭔가 멈출 때마다 내 이름이 불렸다."],
["관물대 쪽으로 슬쩍 고개를 숙인다",0,3,-1,"","옆자리 {D2:이} 대신 끌려갔다. 끌려가던 {D2:이} 문 앞에서 나를 한 번 돌아봤다. 그날 휴가 서류는 결국 다음 날로 밀렸다."]]},
{id:"nb",a:230,b:230,l:0,t:"[20:40] 신병이 전입 왔다. 이름은 {H1}. 더플백을 품에 안고 침상 끝에 걸터앉아 군번줄만 만지작거린다. 새 전투복엔 아직 접힌 자국이 그대로다.",c:[
["관물대 정리법부터 하나씩 챙겨 준다",-2,3,5,"kind","관물대 각 잡는 법, 샤워실 쓰는 순서, 행보관 기분 읽는 법까지 알려 줬다. “충성! 감사합니다!” 신병이 수첩에 받아 적은 게 세 장이었다."],
["“여기선 눈치가 생명이다.” 군기를 잡는다",0,-3,3,"harsh","{H1}의 목소리가 한 단계 올라갔다. 대답은 칼 같았다. 그런데 그 뒤로 일주일 동안 눈은 한 번도 마주치지 않았다."],
["알아서 적응하게 내버려 둔다",0,0,-2,"cold","{H1:은} 일주일 동안 거의 말이 없었다. 밤마다 모포를 머리끝까지 덮고 잤다."]]},
{id:"nb2",a:340,b:480,l:0,if:s=>s.f.kind||s.f.harsh||s.f.cold,
t:s=>s.f.kind?"[01:50] 불침번 교대 시간. {H1:이} 미지근한 초코우유 하나를 내 손에 쥐여 준다. “선임님, 오늘 피곤해 보이셔서… 제가 한 시간 더 서겠습니다.”":s.f.harsh?"[23:20] 화장실에 가다가 샤워실 구석에서 {H1:이} 혼자 우는 걸 봤다. 수도꼭지를 틀어 소리를 덮고 있었다. 눈이 마주치자 소매로 급히 얼굴을 닦는다.":"[14:30] 장비 정비 작업 중, {H1:이} 날카로운 철판 모서리에 손바닥을 베었다. 장갑에 피가 배어 나오는데도 말도 안 하고 계속 손을 놀린다. 옆 사람들은 아직 모른다.",
c:s=>s.f.kind?[["“같이 서자.” 받아 마시고 같이 선다",2,5,4,"","복도 끝 창가에 둘이 나란히 섰다. {H1}의 고향 얘기를 듣다 보니 한 시간이 금방 갔다. 둘이 서면 시간이 반으로 간다는 걸 그날 알았다."],["“괜찮아, 들어가 자.” 돌려준다",0,0,2,"","{H1:은} 어색하게 웃으며 초코우유를 도로 주머니에 넣었다. 침상으로 돌아가는 뒷모습을 보며, 받았으면 더 좋았겠다는 생각이 들었다."]]:s.f.harsh?[["옆에 가서 앉는다",0,4,4,"kind","물소리만 한참 이어졌다. 내가 먼저 말했다. “나도 처음엔 그랬다.” {H1:은} 코를 훌쩍이더니 수도꼭지를 잠갔다."],["못 본 척 지나간다",0,-4,-3,"","다음 날 아침 {H1:은} 아무 일 없다는 듯 평소처럼 웃었다. 그 웃음이 하루 종일 마음에 걸렸다."]]:[["구급함에서 소독약과 반창고를 꺼내 건넨다",0,2,4,"kind","소독약이 닿자 {H1:이} 움찔했다. “…감사합니다.” 그날 저녁 {H1:이} 먼저 PX에 같이 가자고 했다."],["“의무대 가 봐.” 하고 돌려보낸다",0,-2,-2,"","{H1:은} 손에 붕대를 감고 돌아왔다. 고맙다는 말도, 아프다는 말도 없었다. 그 손으로 저녁 배식을 받았다."]]},
{id:"acc",a:430,b:530,l:1,t:"[10:20] 영점 사격장, 사로 5번. 처음 실탄을 쥔 신병이 기능 고장에 당황해 장전된 총을 든 채 옆 사로 쪽으로 돌아선다. 총구가 사람들을 향한다. 통제탑 확성기마저 숨을 멈췄다.",c:[
["달려가 총열을 잡아 땅으로 내린다",-3,0,12,"hero","총열을 움켜쥐고 총구를 땅으로 꺾었다. 탄은 나가지 않았다. 신병은 사로에 주저앉아 한참 일어나지 못했다. 달려온 통제관이 노리쇠를 후퇴시키고 약실부터 확인했다."],
["“사격 중지! 총구 전방!” 크게 외친다",0,-2,8,"hero","호루라기가 연달아 울리고 사로 전체가 멈췄다. 신병은 그제야 총구를 표적 쪽으로 돌렸다. 통제탑에서 내려온 {CO} 중대장이 신병의 소총을 받아 들고 약실부터 확인했다."]]},
{id:"dn",a:9e3,b:9e3,l:4,v:1,t:s=>CAMP(s)?"[03:00] 눈을 뜨자 손전등 불빛이 얼굴에 꽂혀 있다. 당직사관 순찰이다. 그 손에 방금까지 내가 쓰던 불침번 일지가 들려 있다. 볼에 일지 모서리 자국이 선명하다.":"[03:00] 눈을 뜨자 코앞에서 지휘관 휘장이 번쩍인다. {BN} 대대장의 불시 순찰이다. 손에는 방금까지 내가 쓰던 불침번 일지가 들려 있다. 볼에 일지 모서리 자국이 선명하다.",c:s=>CAMP(s)?[ ["“근무 중 이상 없습니다!”",-2,-4,2,"","당직사관은 일지를 몇 장 넘겨 보더니 “수고해라.” 한마디만 남기고 옆 생활관으로 갔다. 볼에 난 자국 얘기는 없었다."], ["“…졸았습니다!” 솔직히 말한다",0,-6,4,"honest","당직사관은 훈련병 번호만 적어 갔다. 다음 날 아침 소대장이 나를 불러 불침번 수칙을 처음부터 다시 외우게 했다. 다른 처벌은 없었다."], ["눈을 다시 감고 자는 척을 이어 간다",-8,-6,-10,"divbust","당직사관이 어깨를 흔들었다. “일어나.” 다음 날 아침 소대장 앞에서 군기훈련을 받았고, 그 주 불침번을 두 번 더 섰다.",0,2]]:[ ["“충성! 근무 중 이상 없습니다!”",-2,-4,2,"","{BN} 대대장은 일지를 훑어보더니 “수고해라.” 한마디만 하고 계단을 내려갔다. 볼에 난 자국 얘기는 없었다."], ["“…졸았습니다!” 솔직히 말한다",0,-6,4,"honest","{BN} 대대장은 이름과 소속만 적어 갔다. 징계는 없었다. 대신 다음 주 대대장 지휘서신에 ‘근무 중 졸았다고 먼저 말한 병사’ 이야기가 실렸다. 이름은 빠졌지만 중대 사람들은 다 알았다."], ["눈을 다시 감고 자는 척을 이어 간다",-8,-6,-10,"divbust","{BN} 대대장이 직접 어깨를 흔들었다. “일어나.” 다음 날 중대에 경고가 내려왔고, 그 주 내 불침번은 두 배가 됐다.",0,2]]},
{id:"ds",a:9e3,b:9e3,l:1,v:1,t:"초코파이를 한 입 베어 물었을 때 계단 아래에서 발소리가 멈춘다. 고개를 들자 가슴의 지휘관 휘장이 보인다. 주말 저녁 부대를 둘러보던 {BN} 대대장이다.",c:[ ["초코파이를 든 채로 경례한다",0,4,8,"divfun","{BN} 대대장이 초코파이와 내 얼굴을 번갈아 보더니 물었다. “맛있나?” “예, 그렇습니다!” “하나 더 먹어라.” 다음 날 생활관마다 초코파이가 한 상자씩 들어왔다."], ["입에 문 채로 얼어붙는다",0,-8,-12,"divbust","“소속이 어디야?” 대답이 초코파이에 막혀 나오지 않았다. {BN} 대대장은 뒤따라온 당직사관에게 명찰을 확인하게 하고 돌아섰다. 다음 날 행보관이 ‘일과 후 막사 뒤 출입 금지’를 공지하면서 내 이름을 두 번 불렀다.",0,1], ["등 뒤로 숨기고 “이상 없습니다!”",0,0,0,"",0,0,0,GB(0.4,"{BN} 대대장은 “일찍 들어가라.” 한마디만 하고 지나갔다. 손을 펴 보니 초코파이가 가루가 돼 있었다.",[0,2,0],"등 뒤에서 비닐이 바스락거렸다. {BN} 대대장은 그냥 지나갔지만 뒤따르던 당직사관이 걸음을 멈췄다. “너, 이리 와 봐.”",[-2,-3,-4,0,"divbust"])]]},
{id:"dsg",a:9e3,b:9e3,l:1,v:1,t:"[02:30] 두 입째를 베어 물었을 때 계단 쪽에서 손전등 불빛이 올라온다. 당직사관 순찰이다. 입 안에 초코파이가 그대로 들어 있다.",c:[ ["급히 삼키고 경례한다",0,-2,0,"","삼키다 사레가 들렸다. 당직사관은 기침이 멎을 때까지 기다렸다가 일지에 서명만 하고 갔다. 다음 날 아침 생활관 문에 ‘근무 중 취식 금지’ 쪽지가 붙었다."], ["입을 가린 채 “근무 중 이상 없습니다!”",0,1,-2,"","발음이 다 뭉개졌다. 당직사관이 손전등으로 일지 옆 비닐 껍질을 비췄다. “다 먹고 다시 보고해.” 그 말만 하고 지나갔다."], ["먹던 초코파이를 내민다",0,3,1,"","당직사관은 잠깐 손전등을 내리더니 손을 저었다. “됐다. 근무나 잘 서. 비닐은 치우고.”"]]},
{id:"snack",a:35,b:520,l:2,r:70,t:"[20:00] 주말 저녁 보급 간식. 상자에서 초코파이 두 개와 바나나우유가 한 사람 몫씩 나왔다. 생활관 TV에선 예능 재방송이 나오고, 다들 비닐 뜯는 소리에 신이 났다.",c:s=>[
["긴빠이 쳐서 혼자 먹으러 나간다",1,6,0,"","막사 뒤 계단 구석에 쭈그려 앉았다. 생활관 창문으로 예능 웃음소리가 새어 나왔다. 바나나우유에 빨대를 꽂았다.",[.45,"ds"]],
["생활관에서 다 같이 나눠 먹는다",0,4,5,"","누군가 PX에서 사 온 과자까지 침상 위에 쏟아졌다. 반으로 쪼갠 초코파이가 이렇게 커 보인 적이 없었다."],
s.d>=230?["근무 나간 후임 몫까지 챙겨 둔다",0,1,6,"","근무 나간 후임 관물대에 초코파이와 우유를 올려 두었다. 근무를 마치고 돌아온 후임이 “선임님, 이거…” 하고 말을 잇지 못했다."]:["근무 나간 {D1n} 몫까지 챙겨 둔다",0,1,6,"","근무에서 돌아온 {D1:이} ‘너 뭐 잘못 먹었냐’며 웃었다. 그러면서 초코파이 반쪽을 내 입에 넣어 줬다."]]},

["“필승!” 창문에 비친 얼굴에 대고 한 번 외쳐 본다",0,3,2,"","목소리가 중간에 갈라졌다. 앞자리 등산복 차림 아저씨가 돌아보더니 피식 웃었다. “해병 가나? 필승이다.” 버스는 그대로 고속도로에 올랐다."],
["이어폰을 꽂고 창밖만 보며 간다",0,0,0,"","휴게소를 두 번 지나자 창밖으로 동해가 보이기 시작했다. ‘포항’ 표지판이 보이자 옆자리 입영자가 이어폰을 뺐다."]]},
{id:"mi",a:0,b:0,l:1,t:"[14:30] 포항 해병대 교육훈련단 입소 첫날. 가족들이 탄 버스가 떠나자마자 조교들 말투가 바뀌었다. 팔각모를 눌러쓴 {KY} 조교가 소리친다. “빨간 명찰 받기 전까지 너희는 해병이 아니다! 훈련병 전원 복창! 안 되면 되게 하라!”",c:[
["“안 되면 되게 하라!” 목이 터져라 외친다",-3,0,8,"","“악!!” 대답 소리에 연병장 비둘기 떼가 일제히 날아올랐다. {KY} 조교의 눈이 가늘어졌다. “좋다. 그 목소리 수료할 때까지 간다.” 저녁 점호 때 이미 목이 쉬어 쇳소리가 났다."],
["입만 벙긋거린다",0,-3,-3,"","“목소리가 안 들린다, 훈련병!” 소대 전체가 나 때문에 스무 번을 더 외쳤다. 옆 훈련병들의 원망 섞인 시선이 뒤통수에 꽂혔다."],
["전우조 눈치를 보며 따라 한다",0,0,2,"","전우조로 정해진 옆 훈련병 입 모양을 보며 반 박자 늦게 따라 외쳤다. 다행히 조교는 앞줄만 보고 있었다."]]},
{id:"gas",a:12,b:38,l:1,t:"[10:00] 화생방 훈련, 가스실. 매캐한 연기 속에서 방독면을 벗으라는 신호가 떨어진다. 관등성명을 끝까지 외쳐야 문이 열린다. 숨을 들이켜는 순간 눈물, 콧물이 한꺼번에 쏟아지고 얼굴이 불에 덴 듯 따갑다.",c:[
["끝까지 또박또박 외치고 나온다",-6,-2,7,"","침을 흘리면서도 군번 끝자리까지 또박또박 외쳤다. 문이 열리자 밖으로 뛰쳐나가 침부터 뱉었다. {KY} 조교가 어깨를 툭 쳤다. “새끼… 독한 놈.”"],
["숨을 참고 문 쪽으로 더듬어 간다",-4,-4,-2,"","숨을 참고 문고리를 더듬다가 조교 손에 뒷덜미를 잡혔다. “다시 들어가라.” 재입장은 처음보다 훨씬 길었다."],
["말문이 막힌 전우조 몫까지 같이 외쳐 준다",-8,2,6,"","둘의 군번과 이름을 번갈아 외쳤다. 콧물이 턱까지 흘렀다. 둘이 부르니 문이 빨리 열린 것 같았다. 밖에 나와 콧물 범벅이 된 얼굴을 보고 둘이 같이 웃었다."]]},
{id:"mx",a:42,b:42,l:1,t:"[03:00] 극기주 사흘째 새벽. 잠을 못 잔 지 오십 시간이 넘었다. 고무보트(IBS)를 일곱 명이 머리에 이고 갯벌을 달린다. 앞에서 전우조가 무릎이 꺾여 주저앉는다. 조교가 외친다. “낙오하면 빨간 명찰은 없다!”",c:[
["“전우야, 같이 간다!” 군장을 나눠 진다",-12,-2,8,"rt","전우조의 팔을 내 어깨에 걸고 보트 손잡이를 같이 잡았다. 결승선을 넘자마자 둘 다 갯벌에 대자로 누웠다. 조교가 우리를 내려다보며 중얼거렸다. “새끼들… 기합.”"],
["이를 악물고 내 몫만 한다",-7,0,2,"rt","보트 손잡이만 보며 달렸다. 결승선에 도착하고서야 전우조가 없다는 걸 알았다. 그는 구급차 앞 담요 위에 앉아 나를 보고 있었다."],
["“못 하겠습니다!” 포기를 외친다",2,-10,-12,"","조교가 다가와 목소리를 낮췄다. “그럼 다음 기수에서 다시 받아라.” 의무실 침상에서 하루를 보내고, 이틀 뒤 다시 대열 맨 끝에 섰다."]]},
{id:"mjd",a:54,b:54,l:1,t:s=>`[11:00] 수료식. 부모님이 가슴에 빨간 명찰을 달아 줬다. 그렇다. 오늘부로 나는 민간인 나부랭이가 아니라 해병인 것이다! 식이 끝나자마자 자대 배치 발표가 이어진다. ${s.b>1?"수첩엔 부모님이 적어 준 연락처 쪽지가 끼워져 있다.":"아는 사람이라곤 하나도 없다. 믿을 건 운뿐이다."}`,c:[
["숨죽이고 내 이름이 불리길 기다린다",0,0,0,"",0,0,0,s=>asg(s,0)],
["진로 상담 때 부모님 직업을 슬쩍 흘린다",0,0,-3,"",0,0,0,s=>asg(s,2)],
["‘백령도 지원’ 용지에 이름을 쓴다",-4,-2,9,"vol",0,0,0,s=>{s.u={n:UM[5][0],q:-2,i:5};return"“진짜 쓴 겁니까?” 조교가 용지를 들어 보이며 되물었다. “필승!” 배치표 맨 앞줄, 백령도 칸에 내 이름이 적혔다. "+UM[5][1]}]]},
{id:"mass",a:56,b:56,l:0,t:s=>"[21:40] ["+s.u.n+"] 자대 첫날 밤. 소등 직전, 선임 해병 다섯이 침상에 빙 둘러앉았다. 맞선임 {S1:이} 팔짱을 끼고 말한다. “아쎄이 왔네. 막내 기수 목청 좀 들어 보자. 군가 ‘나가자 해병대’, 처음부터 끝까지 실시!”",c:[
["“악! 이병 ○○○! 끝까지 하겠습니다!”",-2,2,8,"","3절 끝 소절까지 목이 터져라 불렀다. 침상 끝에서 선임 해병 하나가 무릎을 쳤다. “새끼… 기합!!” 다음 날부터 점호 때 군가 선창은 내 몫이 됐다."],
["“2절까지밖에 모릅니다!” 솔직히 말한다",0,-2,-2,"","“2절? 새끼… 찐빠. 3절은 내일 아침 점호까지 외워 온다. 못 외우면 알지?” 화장실 불빛 아래서 가사를 백 번 읊었다. 다음 날 새벽 점호에서 3절까지 불렀다."],
["“선임님들과 같이 부르겠습니다!”",0,2,-4,"","{S1:이} 피식 웃으며 따라 부르자 몇 명이 박자를 맞췄다. 분위기는 풀렸다. 하지만 침상 끝의 다른 선임은 ‘아쎄이가 선임을 시키네’라며 수첩에 내 이름을 적었다."]]},
{id:"kb",a:60,b:240,l:0,r:120,t:"[06:10] 기상 직후, 침구를 개는 내 앞에 선임 해병 하나가 흙투성이 군화를 툭 내려놓는다. 아침 점호까지 이십 분. “아쎄이, 내 것도 닦아 놔라. 기수가 깡패다. 알겠나?”",c:[
["“예, 알겠습니다! 닦겠습니다!”",-2,-3,2,"","구두약에 침을 묻혀 가며 이십 분 만에 군화 두 켤레를 거울처럼 만들었다. 선임 해병은 군화를 내려다보더니 짧게 내뱉었다. “새끼… 기합.” 해병대에서 그보다 큰 칭찬은 없었다."],
["“그건 제 업무가 아닙니다.”",0,3,-8,"","생활관에 있던 해병들이 동시에 손을 멈췄다. 선임은 군화를 낚아채 들고 나갔다. 그 주 내내 점호 때마다 내 군화만 지적당했다."],
["{PL} 소대장에게 사적 지시를 보고한다",0,2,3,"","그날 오후 {PL} 소대장 면담이 열렸고 선임은 행정반으로 불려 갔다. 돌아온 선임은 나를 보지 않았다. 대신 다른 선임들이 내 경례를 받지 않기 시작했다.",[.4,"gyl"]]]},
{id:"gyl",a:90,b:400,l:0,r:200,gy:1,if:s=>s.rp<=50&&!s.f.gyon,ci:s=>s.rp<=50&&!s.f.gyon,t:"[12:10] 점심시간 식당. 츄라이를 들고 앉자 같은 줄에 있던 선임 셋이 숟가락을 내려놓고 자리를 뜬다. 누구도 내 이름을 부르지 않는다. 등 뒤에서 누군가 내뱉었다. “새끼… 기열.” 그 말이 식당 전체로 번졌다. 기수열외가 시작됐다.",c:[
["“제가 뭘 잘못했습니까!” 따진다",-3,-4,-4,"","“열외 된 놈이 말이 많네.” 대답 대신 의자 끄는 소리만 났다. 그날 저녁 ‘선임에게 대든 아쎄이’라는 보고가 행정반에 올라갔고, 경고는 나에게 떨어졌다.",0,1],
["묵묵히 혼자 먹고 혼자 치운다",-2,-8,0,"","식판도, 근무도, 대화도 혼자였다. 입 밖으로 나오는 말이라곤 ‘필승’ 하나뿐이었다. 해병은 기열이 되어도 근무는 서는 법이다."],
["병영생활상담관을 찾아간다",0,1,-2,"","병영생활상담관이 수첩을 펴고 받아 적기 시작했다. 일주일 뒤 선임 둘이 다른 소대로 전출됐다. 누가 말했는지는 전출 명령보다 소문이 먼저 돌았다."]]},
{id:"ob",a:70,b:240,l:0,r:120,t:"[21:25] 저녁 점호 오 분 전. 관물대 모포 각이 한 칸 어긋난 게 선임 눈에 걸렸다. 형광등 아래서 선임이 소리친다. “아쎄이들 군기가 이게 뭐냐! 전원 꼬라박아! 악기바리 들어간다!”",c:[
["“필승! 죄송합니다!” 머리를 박는다",-6,-3,3,"","머리를 바닥에 박고 뒷짐을 졌다. 이마에 장판 무늬가 도장처럼 찍혔고, 손목은 사흘 동안 시큰거렸다."],
["“저 혼자 하겠습니다.” 동기들을 빼 준다",-9,-2,8,"","혼자서 한 시간을 버텼다. 다음 날 아침, 동기 {D1:이} 내 군화를 닦아 관물대 앞에 놓아두었다."],
["“과도한 얼차려는 규정 위반입니다.”",0,3,-6,"","TV 소리만 남았다. 선임이 웃었다. “규정 잘 아네.” 점호는 아무 일 없이 끝났다. 다음 날 주말 근무표 맨 위에 내 이름이 올라가 있었다.",[.5,"gyl"]]]},
{id:"ph",a:80,b:240,l:0,r:150,t:"[19:10] 일과 후 휴대폰 사용 시간. 반납함에서 폰을 꺼내자마자 선임이 낚아채 흔든다. 잠금 화면이 켜져 있다. “여자친구 사진 있냐? 아쎄이는 비밀이 없다. 열어 봐라.”",c:[
["“예, 보여 드리겠습니다!”",0,-5,2,"","잠금을 풀자 선임들이 폰을 돌려 보며 낄낄댔다. 사진첩은 생활관을 한 바퀴 돌고서야 돌아왔다. 그날 저녁부터 선임들이 여자친구를 ‘제수씨’라고 불렀다."],
["“개인 정보입니다. 곤란합니다.”",0,3,-6,"","선임은 대답 대신 폰을 반납함에 던져 넣었다. ‘군기 교육’이라는 명목으로 내 휴대폰 시간은 일주일 동안 사라졌다."],
["폰을 도로 긴빠이 쳐서 화장실로 숨는다",0,5,-2,"","선임이 한눈판 사이 폰을 도로 긴빠이 쳐서 화장실 칸에 숨었다. 엄마 부재중 전화 일곱 통이 떠 있었다. 통화 버튼을 누르려는 순간 문밖에서 발소리가 멈췄다. 사용 시간 위반으로 경고가 붙었다.",0,1]]},
{id:"ns",a:230,b:230,l:0,t:"[20:30] 아쎄이가 들어왔다. 이름은 {H1}. 침상 구석에 각 잡고 앉아 군번줄만 만지작거린다. 옆에 앉은 선임이 내 옆구리를 찌르며 속삭인다. “우리가 당한 대로 하는 거다. 기수가 다 그렇게 굴러간다.”",c:[
["내가 당한 대로 군기를 잡는다",0,-3,4,"chain","{H1}의 목소리가 한 단계 올라갔다. 대답은 칼 같았다. 눈은 한 번도 마주치지 않았다. 이병 때 내가 딱 저랬다."],
["“여기서 끊는다.” 내가 겪은 걸 말해 준다",-2,4,5,"stop","{H1:이} 한참 만에 입을 뗐다. “필승… 감사합니다.” 처음 들어 보는 대답이었다. 등 뒤에서 선임이 비웃었다. “너는 안 당했냐? 성인군자 났네.” 선임들은 한동안 나를 쳐다봤다.",[.35,"gyl"]],
["선임 눈치만 보며 내버려 둔다",0,0,-2,"","{H1:은} 한 주 내내 말이 없었다. 밤마다 모포를 머리끝까지 덮고 잤다."]]},
{id:"sb",a:100,b:450,l:1,r:200,if:s=>s.u.i>=2,t:"[04:40] 상륙기습훈련, 새벽 갯벌. 고무보트(IBS)를 머리에 이고 허리까지 차는 파도를 건너야 한다. 그런데 한 발짝 내딛는 순간 군화 한 짝이 뻘에 박혀 꿈쩍도 하지 않는다. 뒤에서 보트 대열이 밀려온다.",c:[
["군화를 버리고 맨발로 달린다",-8,-2,6,"","발바닥이 조개껍데기에 몇 군데 베였다. 보트 대열은 끝까지 따라갔다. 훈련이 끝나자 선임 해병이 “새끼… 독종이네.” 하며 뽀글이 한 봉지를 쥐여 줬다."],
["전우조에게 업혀 나온다",-3,0,-3,"","전우조가 내 허리를 잡아 끌어냈다. 군화는 결국 뻘 속에 두고 왔다. “고맙다, 전우야.” 복귀하자마자 소대에서 ‘뻘 해병’이라는 별명이 붙었다."],
["군화를 포기하고 보급을 요청한다",0,-3,-4,"","훈련이 끝나고 군화 분실 경위서를 썼다. 보급관은 혀를 차며 경고를 달았다. 새로 받은 군화는 발에 맞기까지 두 주가 걸렸다.",0,1]]},
{id:"cons",a:120,b:420,l:5,r:200,t:"[14:00] 분기 정기 면담 날. 병영생활상담관실의 작은 창 너머로 선임 하나가 복도를 서성이는 게 보인다. 상담관이 볼펜 뚜껑을 열며 묻는다. “요즘 힘든 점은 없습니까? 여기서 한 말은 밖으로 안 나갑니다.”",c:[
["“전부 말씀드리겠습니다.”",0,6,-2,"","말을 시작하자 멈출 수가 없었다. 상담관이 메모지를 세 장째 넘겼다. 다음 주부터 생활관 분위기가 달라졌다. 한 달쯤 지나자 다시 원래대로 돌아갔다."],
["“없습니다! 필승!” 하고 나온다",0,-3,2,"","“그래요. 언제든 오세요.” 상담관이 명함을 내밀었다. 복도로 나오자 서성이던 선임이 내 얼굴을 한참 살폈다."],
["복도 끝 익명 신고함에 적어 넣는다",0,2,-1,"","왼손으로 삐뚤빼뚤 써서 접어 넣었다. 신고함은 일주일 뒤 열렸다. 누가 썼는지는 드러나지 않았고, 생활관 전체가 한동안 서로를 의심했다."]]},
{id:"sw",a:50,b:500,l:4,r:150,if:s=>s.u.i>3,t:"[02:10] 해안 경계 근무. 짙은 해무가 초소 창문까지 밀려와 열 걸음 앞도 보이지 않는다. 그 너머에서 정체 모를 불빛 하나가 세 번 깜빡이고 꺼진다. 레이더 화면엔 아무것도 잡히지 않는다.",c:[
["“정지! 정지!” 해무를 향해 소리친다",0,-2,3,"","불빛은 대답이 없었다. 해무가 걷히자 통통거리는 소형 어선이 보였다. 선장이 손전등을 흔들었다. 다음 날 상황 보고서는 두 장이 됐다."],
["상황실에 즉시 보고한다",0,2,4,"","“확인 중이다. 계속 감시해라.” 무전기를 쥔 손에 땀이 찼다. 한 시간 뒤 해경 레이더에서 조업 어선으로 확인됐다. 보고서엔 ‘적절한 조치’라고 적혔다."],
["그냥 감시만 이어 간다",-2,-3,-5,"","불빛은 다시 나타나지 않았다. 다음 날 해안 감시 카메라 기록에 그 불빛이 찍혀 있었고, 보고하지 않은 내 근무 시간도 함께 남았다.",0,1]]},
{id:"lv",a:150,b:480,l:3,r:150,t:"[10:20] 휴가 출발. 위병소를 나서며 팔각모를 고쳐 쓴다. 가슴엔 빨간 명찰, 손엔 휴가증. 서울행 기차를 갈아타고 오른 지하철에서 교복 입은 아이들이 자꾸 힐끔거린다.",c:[
["허리를 쫙 펴고 해병 포스로 간다",0,6,4,"","손잡이도 잡지 않고 섰다. 지하철이 급정거해도 해병의 하체는 흔들리지 않는 것이었다! 내릴 때 교복 입은 아이 하나가 ‘필승…’ 하고 작게 속삭였다. 나는 돌아서서 ‘악!’으로 답했다."],
["전투복 위에 후드를 뒤집어쓴다",0,3,0,"","팔각모는 가방 깊숙이 숨겼다. 그런데 열차 문이 열리자 몸이 저절로 각을 잡고 걸었다. 걸음걸이는 못 숨겼다."],
["친구들과 해병 인증 사진을 찍는다",-4,10,2,"","역 광장에서 친구들과 팔각모를 돌려 쓰며 사진을 서른 장 찍었다. 사진이 중대 단톡방까지 돌았다. 복귀한 날부터 ‘인증샷 해병’으로 불렸다."]]},
{id:`hr`,a:3,b:11,l:0,t:`[09:30] 입소 사흘째, 이발실. 바리깡이 머리 위를 지나갈 때마다 입대 전 공들인 머리가 한 움큼씩 바닥에 떨어진다. 거울 속에서 상륙돌격형 머리, 일명 ‘해병 수박’이 서서히 모습을 드러낸다. “다음, 훈련병!”`,c:[[`“필승!” 눈 감고 끝까지 앉아 있는다`,0,2,3,``,`눈을 떠 보니 머리는 사라졌지만 이마는 의외로 괜찮았다. 뒤에 서 있던 {KY} 조교가 “다음.” 하고 뒷사람을 불렀다.`],[`이발병과 머리 모양을 협상한다`,0,-2,-3,``,`“옆머리는 조금만…” 말이 끝나기도 전에 바리깡이 한 번 더 지나갔다. “여기 이발소 아니다, 훈련병.” 협상 결과는 더 짧아진 머리였다.`],[`옆 전우조 머리를 보고 쪼갠다`,0,4,-4,``,`웃음이 터지는 순간 바리깡이 내 머리 위로 한 번 더 지나갔다. 거울 속 내 머리도 정확히 같은 꼴이 됐다. 이번엔 전우조가 웃었다.`]]},
{id:`jj`,a:70,b:240,l:0,r:9e3,t:`[21:50] 일과 후 화장실 앞 복도. 선임 둘이 팔짱을 끼고 길을 막아선다. “아쎄이, 소문 들었지? 오늘 해병짜장 한다. 통과 못 하면 해병 아니다.” 이름만 짜장일 뿐 음식이 아니다. 진작 사라졌어야 할, 악명 높은 가혹행위다.`,c:[[`“필승! 그건 가혹행위입니다!” 거부한다`,-3,-2,5,``,`선임의 얼굴이 굳었다. 그날 밤 점호는 평소보다 이십 분 길었다. 나한테 따로 떨어진 건 없었다. 다음 날 동기들이 PX에 갈 때 내 몫까지 사 왔다.`,[.4,`gyl`]],[`병영생활상담관에게 몰래 신고한다`,0,3,-2,``,`다음 날 아침 상담관실 문을 두드렸다. 상담관이 메모지를 넘겨 가며 받아 적었다. 사흘 뒤 선임들이 군사경찰대로 한꺼번에 불려 갔다. 그날 저녁 생활관 TV는 꺼져 있었다.`],[`고개를 숙이고 따라간다`,-5,-14,-6,``,`그날 밤 일은 누구에게도 말하지 못했다. 그 뒤로 식당에 짜장이 나오는 날이면 밥을 거의 남겼다.`,0,0]]},
{id:`jc`,a:90,b:240,l:2,r:200,t:`[18:40] 저녁을 먹고 나온 PX 앞 벤치. 선임이 검은 봉지를 흔들며 손짓한다. 주변 선임들이 의미심장하게 웃는다. “아쎄이, 해병 초콜릿 먹을 줄 아냐? 마지막 한 조각은 막내가 먹는 거다.”`,c:[[`“필승! 감사히 먹겠습니다!”`,0,5,3,``,`봉지 안엔 그냥 PX 초코바가 들어 있었다. 둘러선 선임들이 먼저 웃음을 터뜨렸다. “장난이다, 아쎄이. 먹어.”`],[`“선임님 드십시오!” 양보한다`,0,2,5,``,`“새끼… 기합.” 선임 해병이 초코바를 반으로 쪼개 내 손에 쥐여 줬다. 그렇다. 해병의 초콜릿은 나눠 먹는 것이었다.`],[`의심하며 포장지부터 확인한다`,0,-2,-4,``,`포장지를 뒤집어 유통기한부터 확인했다. 멀쩡했다. “의심이 많네, 아쎄이.” 선임들의 웃음이 뚝 끊겼고 분위기만 싸해졌다.`]]},
{id:"gyl2",a:0,b:9e3,l:0,n:1,gy:1,if:s=>s.br==1&&!s.nco&&!s.f.gyon&&!!s.f.gyout&&s.rp<=50&&s.d>=70&&s.d-(s.f.gxd|0)>=30&&Math.random()<.04,t:"[19:40] 일과 후 생활관. 내가 들어서자 TV 앞에 모여 있던 해병들이 하나둘 흩어진다. 누군가 리모컨을 내 침상에 툭 던지고 나갔다. 또다시 기열이다.",c:[
["“제가 또 뭘 잘못했습니까!”",0,-3,-2,"","대답 대신 문 닫히는 소리만 났다. 그날 밤 점호에서 내 이름만 두 번 불렸다.",0,0,GYR],
["묵묵히 내 할 일만 한다",0,-4,0,"","근무, 청소, 점호. 하루가 혼자 돌아갔다. 해병은 기열이 되어도 근무는 서는 법이다.",0,0,GYR],
["동기를 찾아간다",0,2,0,"","동기 {D1:이} 맛스타 하나를 건넸다. “버텨. 일로 보여 주면 다 풀린다.”",0,0,GYR]]},
{id:"gyx",a:0,b:9e3,l:2,n:1,if:s=>s.br==1&&!s.nco&&!!s.f.gyon&&s.rp>50,t:"[12:10] 점심시간 식당. 츄라이를 들고 빈자리를 찾는데 {S1:이} 옆자리를 툭툭 친다. “야, 여기 앉아라.” 식탁의 숟가락들이 동시에 멈췄다가 다시 움직인다. 기수열외가 풀렸다.",c:[
["“악! 감사합니다!” 그 자리에 앉는다",0,6,2,"","자리에 앉자 맞은편 해병이 깍두기 그릇을 내 쪽으로 밀어 줬다. 그렇다. 기열은 끝났고, 나는 다시 해병이 된 것이었다!",0,0,GYX],
["“괜찮습니다.” 혼자 먹던 자리로 간다",0,2,-1,"","혼자 먹던 구석 자리로 갔다. 잠시 뒤 {S1:이} 츄라이를 들고 맞은편에 앉았다. “고집 하나는 기합이네.”",0,0,GYX],
["“이제 와서 말입니까?”",0,3,-2,"","{S1:이} 숟가락을 내려놓았다. “늦게라도 하는 거다. 앉아.” 나는 앉았다.",0,0,GYX]]},
{id:"gisu",a:57,b:110,l:0,r:200,t:"[22:10] 소등 직전, 침상 끝. 맞선임 {S1:이} 수첩 한 장을 건넨다. 생활관 선임 열두 명의 이름과 기수가 빼곡하다. “내일 아침 점호 전까지 다 외운다. 해병은 기수가 곧 족보다.”",c:[
["“악! 다 외우겠습니다!” 밤새 외운다",-4,-2,7,"","화장실 불빛 아래서 이름과 기수를 백 번씩 읊었다. 다음 날 아침 선임 해병들이 차례로 기수를 물었다. 열두 명 모두 막힘없이 대답했다. {S1:이} 짧게 내뱉었다. “새끼… 기합.”"],
["외우는 척하다 잠든다",3,2,-6,"","눈을 떠 보니 기상나팔이었다. 첫 질문에 1271기를 1217기라고 대답했다. “새끼… 찐빠.” 그날 저녁, 외울 수첩은 두 장으로 늘어 있었다."],
["동기와 나눠 외우고 서로 시험한다",-2,1,4,"","동기 {D1:과} 반씩 나눠 외우고 서로 문제를 냈다. 다음 날 아침 둘이 번갈아 대답했다. {S1:이} 수첩을 덮으며 말했다. “동기끼리 붙어 다니는 건 봐준다.”"]]},
{id:"jcq",a:58,b:200,l:0,r:200,t:"[13:20] 점심을 먹고 돌아온 생활관. 화장실이 급하다. 그러나 해병대에는 해병대의 말법이 있다. 선임에게 허락을 구하는 한 문장에도 법도가 있는 것이다. 침상에 누운 {S2:이} 눈을 감은 채 기다린다.",c:[
["“악! {S2}, 화장실 다녀와도 되는지 여쭤봐도 되겠습니까?”",0,1,4,"","{S2:이} 한쪽 눈을 떴다. “…완벽하네. 다녀와라.” 의문문 속에 의문문을 품은 그 한 문장에 해병의 법도가 다 들어 있었던 것이다."],
["“화장실 좀 다녀오겠습니다.”",0,-2,-5,"","{S2:이} 벌떡 일어났다. “다녀오겠습니다? 통보냐? 새끼… 찐빠!!” 화장실은 십 분 뒤에야 갈 수 있었다. 그동안 ‘여쭤봐도 되겠습니까’를 서른 번 복창했다."],
["“화장실은 허락받고 가는 데가 아닙니다.” 그냥 다녀온다",0,3,-3,"","돌아오니 {S2:이} 수첩에 뭔가 적고 있었다. 마침 그 주 부대 게시판엔 ‘병영 악습 근절’ 공문이 붙어 있었다. 공문은 공문이고, 수첩은 수첩이었다."]]},
{id:"gin",a:70,b:240,l:0,r:200,t:"[23:10] 소등 뒤 생활관. 선임 해병 하나가 어둠 속에서 손짓한다. 취사장 냉장고에 내일 아침 부식 소시지 한 상자가 들어왔다는 첩보다. “아쎄이, 긴빠이 한번 쳐 볼래? 해병은 보급도 스스로 하는 법이다.”",c:[
["“악!” 취사장으로 잠입한다",0,0,0,"",0,0,0,GB(.45,"취사장 창문으로 들어가 소시지 한 줄을 긴빠이 쳤다. 그날 밤 모포 밑에서 소시지 파티가 열렸다. 선임 해병이 소시지를 높이 들었다. “보아라, 이것이 해병의 보급이다!”",[0,5,3],"냉장고 문을 여는 순간 불이 켜졌다. 취사장 입구에 당직사관이 팔짱을 끼고 서 있었다. “해병의 보급이라고?” 다음 날 아침 소시지는 정량대로 나왔고, 나는 경위서를 썼다.",[0,-4,-6,1])],
["“그건 긴빠이가 아니라 절도입니다.”",0,2,-3,"","“…새끼, 농담이다.” 선임 해병은 돌아누웠다. 다음 날 아침 소시지는 정량대로 나왔다. 선임 해병이 자기 소시지 하나를 내 츄라이에 올려놓았다. 설명은 없었다."],
["자는 척한다",1,0,-2,"","숨을 고르게 쉬었다. 선임 해병은 옆 침상 아쎄이를 깨웠다. 다음 날 그 아쎄이가 경위서를 썼다. 나는 아침밥을 먹었다."]]},
{id:"redm",a:70,b:450,l:0,r:200,t:"[20:50] 세탁실. 탈수가 끝난 세탁기 뚜껑을 열자 분대원 일곱 명의 흰 러닝셔츠가 전부 분홍색이 돼 있다. 그 한가운데에 새 빨간 명찰 하나가 얌전히 떠 있다. 명찰 뒷면엔 내 이름이 적혀 있다.",c:[
["“악! 제 찐빠입니다!” 바로 자수한다",0,-2,4,"","분대원 일곱 명 앞에서 ‘악!’ 소리와 함께 자수하였다. 분대장 {SQ:이} 분홍 러닝을 들어 보이며 말했다. “해병은 속옷까지 빨갛게 물드는 법이다.” 그 주 내내 분대 전체가 분홍 러닝을 입고 구보를 뛰었다."],
["PX에서 표백제를 사 와 몰래 되돌린다",-3,0,-2,"","PX 문 닫기 직전에 표백제 한 통을 사 와서 밤새 세 번을 다시 돌렸다. 러닝은 연분홍이 됐다. 다음 날 아침 분대장 {SQ:이} 러닝을 들어 보이며 물었다. “이거 누구 작품이냐?”"],
["명찰 뒷면 이름을 지우고 모른 척한다",0,-3,-8,"","이름을 볼펜으로 까맣게 칠했다. 다음 날 아침 생활관에서 빨간 명찰이 없는 해병은 나 하나뿐이었다. 수사는 삼십 초 만에 끝났다. “새끼… 기열!!”",0,1]]},
{id:"jsk",a:60,b:450,l:0,r:200,t:"[10:00] 수요일 정신교육 시간, 대대 강당. 스크린에 ‘해병대 정신’ 다섯 글자가 뜬다. 정훈장교가 마이크를 잡는다. “지금부터 복창한다. 한 번 해병은!”",c:[
["“영원한 해병!” 강당이 떠나가게 외친다",-1,2,5,"","“영원한 해병!!” 내 목소리가 대대 전체보다 반 박자 앞서 나갔다. 정훈장교가 마이크를 내려놓고 나를 가리켰다. “저 해병, 다음 시간 선창.” 그렇다. 해병의 정신은 목청에서 나오는 것이었다."],
["조명이 꺼지자 고개를 떨구고 존다",2,2,-3,"","꿈속에서도 ‘한 번 해병은’을 외쳤다. 깨 보니 진짜로 외치고 있었다. 혼자서. 강당 오백 명이 웃음을 터뜨렸고, 정훈장교는 그 장면을 다음 교육 때 쓰겠다고 했다."],
["“질문 있습니다!” 손을 든다",0,3,1,"","“해병대 정신과 기수열외는 어떻게 다릅니까?” 강당 오백 명이 동시에 숨을 멈췄다. 정훈장교는 잠시 생각하더니 대답했다. “좋은 질문이다. 기수열외는 해병대 정신이 아니다.” 그 대답은 그날 교육 일지 첫 줄에 적혔다."]]},
{id:"mnews",a:120,b:520,l:0,r:200,t:"[21:00] 생활관 TV 저녁 뉴스. 앵커가 진지한 얼굴로 말한다. “해병대 한 부대에서 장병들이 직접 키운 진돗개가 위병소 근무를 서 화제입니다.” 화면에 익숙한 위병소가 나온다. 우리 부대 진돗개 ‘오도’다.",c:[
["“악! 오도다!” 다 같이 환호한다",0,4,2,"","화면 속 오도가 앞발을 들었다. 생활관 전체가 TV를 향해 ‘필승!’을 외쳤다. 뉴스 끝에 군 관계자는 “오도는 정식 병력이 아니다”라고 밝혔다. 다음 날 오도의 밥그릇엔 소시지가 세 개 더 들어 있었다."],
["인터뷰한 해병이 누군지 찾아본다",0,2,1,"","자막엔 ‘해병대 모 부대 상병’이라고만 나왔다. 모자이크 너머 목소리가 너무 익숙했다. 그 상병은 그날 밤 생활관에서 사인을 열두 장 해 줬다."],
["채널을 돌리자고 한다",0,-2,-3,"","리모컨에 손을 대는 순간 열두 명이 동시에 나를 쳐다봤다. “새끼… 오도 방송을 돌려?” 그날 밤 나는 오도 산책 당번이 됐다."]]},
{id:"ghst",a:80,b:520,l:4,r:200,if:s=>s.u.i>=2,t:"[02:40] 해안 초소 야간 근무. 투입 전에 선임이 일러 준 이야기가 있다. 이 초소엔 밤마다 ‘전역 못 한 해병’이 순찰을 돈다고. 그때 초소 계단 아래에서 젖은 전투화 소리가 저벅저벅 올라온다.",c:[
["“정지! 손들어! 암구호!”",0,-1,4,"","“…바다!” 정확한 답어가 돌아왔다. 올라온 건 순찰 나온 소초장이었다. 전투화는 갯바위에서 미끄러져 젖은 것이었다. 소초장이 바짓단을 털며 말했다. “귀신 잡는 해병이 귀신 소리에 쫄았나?”"],
["랜턴을 켜고 계단 아래를 비춘다",0,-3,-2,"","불빛 속에서 커다란 게 한 마리가 집게를 치켜들었다. 그 뒤에 서 있던 소초장이 불빛에 눈을 찌푸렸다. “야간 근무 중에 불빛 노출하지 마라.” 근무 일지에 지적 사항이 한 줄 붙었다."],
["“필승! 근무 중 이상 무!” 일단 크게 보고한다",0,2,1,"","어둠 속에서 대답이 돌아왔다. “…필승. 수고한다.” 순찰 나온 대대장이었다. 다음 날부터 그 초소 귀신 이야기는 쏙 들어가고, ‘귀신같이 보고하는 해병’ 이야기만 돌았다."]]},
{id:"pal",a:100,b:480,l:0,r:200,t:"[22:30] 휴가 전날 밤. 생활관 다리미 앞에 해병들이 줄을 섰다. 팔각모 여덟 모서리가 칼처럼 서야 위병소를 통과한다는 것이 이 부대의 전설이다. 내 차례가 왔다.",c:[
["풀을 먹여 칼각을 세운다",-1,3,4,"","풀을 두 번 먹이고 다리미를 세 번 눌렀다. 모서리에 종이를 대 보니 종이가 베였다. 다음 날 위병소 근무자가 팔각모를 보고 경례를 한 번 더 했다. 그렇다. 해병의 휴가는 팔각모에서 시작되는 것이었다."],
["선임들 것부터 다려 준다",-2,0,5,"","선임 해병 셋의 팔각모를 먼저 다렸다. 내 차례가 오자 다리미가 꺼졌다. 맞선임 {S1:이} 자기 팔각모를 내 머리에 씌워 줬다. “오늘만 빌려준다. 새끼… 기합.”"],
["손바닥으로 대충 각을 잡는다",0,1,-4,"","손바닥으로 몇 번 눌러 각을 잡았다. 위병소 근무자가 내 팔각모를 한참 쳐다봤다. “…칠각모네요.” 휴가 출발이 십 분 늦어졌다."]]},
{id:"odb",a:180,b:520,l:1,r:200,t:"[06:40] 연병장 구석, 칠이 다 벗겨진 낡은 봉고 한 대. 해병들은 이 차를 ‘오도봉고’라 부른다. 오늘 아쎄이 셋을 태우고 보급대대에 다녀와야 하는데 시동이 걸리지 않는다. 보급 시간까지 이십 분.",c:[
["“악!” 아쎄이들과 밀어서 시동을 건다",-5,2,6,"","“하나, 둘, 악!” 아쎄이 셋과 연병장 반 바퀴를 밀었다. 내리막에 들어서자 엔진이 ‘컥’ 하고 살아났다. 그렇다! 오도봉고는 기름이 아니라 해병의 악으로 달리는 차였던 것이다! 보급은 오 분 일찍 끝났다."],
["정비반에 정식으로 수리를 요청한다",0,1,2,"","정비반 해병이 보닛을 열더니 배터리 단자를 조였다. 시동이 한 번에 걸렸다. “이거 십 년째 이래.” 보급은 제시간에 끝났다. 정비 일지엔 같은 고장이 백열두 번째로 적혔다."],
["“아쎄이들은 걸어서 간다!” 행군을 시킨다",-2,-2,-6,"","아쎄이 셋이 보급품을 메고 사 킬로미터를 걸었다. 돌아오는 길에 행보관에게 걸렸다. “봉고는 장식이냐?” 그날 오후 오도봉고 대신 내가 정비반 청소에 투입됐다."]]},
{id:"air",a:150,b:520,l:3,r:200,t:"[13:30] 휴가 복귀 길, 터미널 대합실. 옆자리에 공군 근무복을 입은 병사가 앉는다. 상대도 내 빨간 명찰을 봤다. 둘 다 휴대폰 화면을 끄고 허리를 편다.",c:[
["먼저 “필승!” 경례를 붙인다",0,3,2,"","“필승!” 그쪽도 “필승!” 둘 다 필승이었다. 해병과 공군이 같은 구호를 쓴다는 사실에 둘 다 잠깐 할 말을 잃었다. 버스가 올 때까지 서로 부대 식당 메뉴를 물었다. 그쪽 대답을 듣고 속으로 외쳤다. 따흐앙…!"],
["빨간 명찰을 앞세우고 꼿꼿이 앉아 있는다",0,1,0,"","둘 다 앞만 보고 앉아 있었다. 버스는 그쪽이 먼저 왔다. 떠나면서 그가 창문 너머로 경례를 했다. 나는 반사적으로 ‘악!’ 하고 받았다. 대합실 사람들이 일제히 돌아봤다."],
["공군 식당 메뉴를 슬쩍 물어본다",0,4,-1,"","“어제 저녁에 뭐 나왔어요?” “…함박스테이크요.” 귀를 의심했다. 복귀 버스에서 그 단어가 계속 맴돌았다. 함박스테이크. 오늘 저녁 내 츄라이엔 똥국이 올라올 것이다."]]},
{id:"jwh",a:150,b:520,l:3,r:200,t:"[16:00] 휴가 이틀째, 동네 사거리. 조끼를 입은 아저씨 셋이 교통정리를 하고 있다. 조끼 등판에 ‘해병대 전우회’ 글씨. 그중 한 명이 내 빨간 명찰을 발견하고 호루라기를 멈춘다.",c:[
["“악! 필승!” 사거리 한가운데서 경례한다",0,5,4,"","“필승!!” 아저씨 셋이 동시에 경례를 받았다. 신호가 두 번 바뀌는 동안 기수 확인이 이어졌다. 제일 앞 기수는 우리 아버지보다 나이가 많았다. 그날 저녁은 아저씨들이 국밥을 샀다. “한 번 해병은?” “영원한 해병!”"],
["꾸벅 인사만 하고 지나간다",0,0,-2,"","고개만 숙이고 지나가는데 등 뒤에서 호루라기가 길게 울렸다. “거기 해병! 경례는 어디 두고 왔나!” 휴가 중에도 해병은 해병이었다."],
["조끼를 빌려 입고 교통정리를 돕는다",-2,4,3,"","조끼 하나를 얻어 입고 한 시간 동안 수신호를 했다. 지나가던 버스 기사님이 창문을 내리고 ‘필승’ 했다. 이 동네엔 생각보다 해병이 많았던 것이다."]]},
{id:"mlast",a:520,b:520,l:3,if:s=>!s.nco,t:"[21:20] 전역 한 달 전, 점호가 끝난 생활관. 관물대 문 안쪽 달력엔 엑스 표가 빼곡하다. {H1:이} 침상 옆에 각 잡고 앉아 조심스레 묻는다. “필승! 병장님, 마지막으로 하실 말씀 있습니까?”",c:[
["“우리 기수에서 끝내자. 물려주지 마라.”",-2,4,8,"stop","{H1:이} 수첩을 꺼내 그 말을 받아 적었다. 전역하는 날 아침, 생활관 게시판에 그 문장이 붙어 있었다."],
["“안 되면 되게 하라.” 한마디만 남긴다",0,2,3,"","마지막까지 군가 가사 같은 소리를 했다. 후임 하나가 참다못해 쪼갰고, 생활관 전체가 따라 웃었다."],
["달력에 날짜만 지워 나간다",0,-3,-2,"","침상에 누워 천장만 봤다. 시계 초침만 보며 사흘이 갔고, 그 사흘이 한 달 같았다."]]},

{id:"n0",a:0,b:0,l:0,v:1,if:nd(1),t:"[08:30] 임관식 다음 날 아침. 옷깃의 하사 계급장이 아직 낯설어 자꾸 손이 간다. 생활관 앞에 분대원 아홉 명이 일렬로 섰다. 어제까지 내 후임이던 {H1}도 그 줄에 서 있다. 처음으로 나를 ‘분대장님’이라고 부른다.",c:[
["이름을 하나씩 불러 주며 악수한다",0,3,4,"nl","명찰을 보며 이름을 하나씩 불러 주고 손을 잡았다. 세 번째 병사가 간부가 제 이름을 불러 준 건 처음이라며 웃었다. {H1:은} 끝까지 웃음을 참았다. 분위기가 풀렸다."],
["“군기는 처음부터 잡는다.”",0,-2,5,"","분대원들 얼굴이 굳었다. 대열은 자로 잰 듯 반듯해졌다. 그날 저녁부터 분대원들이 내 앞에서 사적인 얘기를 하지 않았다."],
["“편하게들 해.” 거리를 줄인다",0,2,-2,"","분위기는 편했다. 너무 편했다. 이튿날 아침 점호 대열이 삐뚤어졌고, 당직사관이 나를 쳐다봤다."]]},
{id:"n1",a:0,b:9e3,l:1,v:1,if:nw(20,300),t:"[20:30] 분대 전투 기술 평가 전날 밤. 분대원 하나가 총기 분해결합 연습에서 같은 부품을 세 번째 빼먹는다. 노리쇠뭉치를 쥔 손이 땀으로 미끄럽다. 평가는 내일 아침 여덟 시다.",c:[
["야간에 그 병사만 따로 지도한다",-4,-2,7,"","새벽 한 시까지 행정반 책상에서 부품 순서를 같이 외웠다. 눈 감고 열 번. 평가에서 그 병사가 처음으로 제한 시간 안에 결합을 끝냈다."],
["분대원 전체가 같이 반복하게 한다",-2,0,3,"","분대 전원이 생활관 바닥에 총을 펴 놓고 스무 번을 반복했다. 같이 틀리고 같이 맞췄다. 평균 기록은 올랐다. 불만도 같이 올랐다."],
["그 병사는 평가 대열에서 뺀다",0,-3,-6,"","평가 명단에서 그 병사 이름을 지웠다. 분대 점수는 올랐다. 빠진 병사는 한 달 내내 내 눈을 피했다."]]},
{id:"n2",a:0,b:9e3,l:0,v:2,if:nw(40,380),t:"[19:40] 부대 앞 고깃집, 중대 간부 회식. 불판 위 삼겹살이 타 들어가는데 {CO} 중대장이 잔을 건네며 묻는다. “하사는 군에서 뭘 하고 싶나?” 상사들의 젓가락이 일제히 멈춘다.",c:[
["“장기 복무하며 부대를 키우고 싶습니다.”",0,0,5,"","{HB} 행보관이 “맞는 말이다.” 하고 거들었다. {CO} 중대장은 ‘말은 쉽지’ 하며 웃더니, 내 잔을 가득 채웠다."],
["“공부하며 전문성을 키우고 싶습니다.”",0,4,3,"","{CO} 중대장이 학점은행제와 군 위탁 교육을 알려 줬다. 다음 날 출근해 보니 안내 서류가 내 책상 위에 올라와 있었다."],
["술잔만 받으며 웃어넘긴다",-3,0,-2,"","웃으며 잔만 비웠다. 질문은 대답 없이 지나갔다. 그날 밤 기억도 같이 지나갔다. 다음 날 아침 머리가 깨질 듯 아팠다."]]},
{id:"n3",a:0,b:9e3,l:0,v:1,if:nw(50,420),t:"[21:40] 점호가 끝난 복도, 분대원 하나가 주위를 살피며 다가온다. “분대장님, 옆 분대 병장이 후임을 계속 괴롭힙니다. 관물대 뒤에서 때리는 것도 봤습니다. 말하면 제가 찍힐까 봐…”",c:[
["중대장에게 정식으로 보고한다",0,2,3,"nl","다음 날 아침 {CO} 중대장에게 정식으로 보고했다. 조치는 빨랐다. 그 병장은 군사경찰 조사를 받았고, 제보자의 이름은 끝까지 익명으로 남았다."],
["그 병장을 직접 찾아가 따진다",0,0,0,"",0,0,0,GB(0.4,"옆 분대 생활관으로 가 그 병장을 불러냈다. 병장은 한참 나를 노려보더니 고개를 숙였다. 그 주부터 후임 생활관 쪽에서 들리던 고함이 그쳤다.",[-1,2,4],"“하사가 뭘 안다고.” 병장은 코웃음을 쳤다. 이튿날부터 두 분대 사이에 말이 끊겼고, 괴롭힘은 더 은밀해졌다.",[-2,-3,-2])],
["“일단 지켜보자.”",0,-4,0,"nbad","한 달 뒤 같은 이야기를 다른 병사에게서 또 들었다. 이번엔 피해자가 의무대에 있었다. 너무 늦었다."]]},
{id:"n4",a:0,b:9e3,l:4,if:nw(60,450),t:"[03:30] 당직 부사관 첫 야간 근무. 손전등을 들고 새벽 순찰을 도는데, 위병소 근무자가 소총을 끌어안은 채 고개를 떨구고 졸고 있다. 위병소 벽시계는 새벽 세 시 반을 가리킨다.",c:[
["깨우지 않고 십 분 대신 서 준다",-5,-1,3,"","옆에 서서 십 분 동안 대신 정문을 지켰다. 병사가 퍼뜩 눈을 떴다. 입이 반쯤 벌어졌다. 내가 먼저 말했다. “이 일은 없던 거다. 다음은 없다.”"],
["규정대로 일지에 적는다",0,-2,-3,"","당직 일지에 시각과 이름을 적었다. 병사는 군기교육대 대상이 됐다."],
["어깨를 두드려 깨우고 한마디 한다",0,1,2,"","어깨를 두드리자 병사가 소스라치며 일어섰다. “한 번은 봐준다.” 다음 날부터 그 병사는 근무 때마다 나보다 먼저 초소에 나와 있었다."]]},
{id:"n5",a:0,b:9e3,l:5,v:2,if:nw(80,460),t:"[14:00] 갓 임관한 소위가 소대장으로 부임했다. 첫 작품이라며 내민 훈련 계획서는 교범을 그대로 옮겨 적은 것이다. 우리 훈련장 사정과 안 맞는 곳이 한둘이 아니다.",c:[
["둘만 있을 때 따로 고쳐 준다",-1,0,5,"","행정반에 둘만 남았을 때 지도를 펴고 하나씩 짚어 줬다. 소위가 수첩에 받아 적으며 꾸벅 고개를 숙였다. 다음 주 계획서는 달랐다."],
["지시대로 그냥 따른다",-4,-2,-2,"","훈련은 계획서대로 굴러갔다. 병사들은 계획서에 없는 진흙탕에서 두 번 넘어졌다. 강평 시간에 그 얘기를 꺼낸 사람은 없었다."],
["회의 자리에서 문제를 지적한다",0,-3,-6,"","중대 회의 자리에서 계획서의 문제를 조목조목 짚었다. 소위의 얼굴이 굳었다. 그 뒤로 내 의견은 회의록에 오르지 않았다."]]},
{id:"n6",a:0,b:9e3,l:5,if:nw(110,480),t:"[19:00] 상급부대 정기 검열 사흘 전. 장비 대장을 펼쳐 보니 전임자가 남긴 수정 테이프 자국과 빈칸투성이다. 창고의 방독면 수량부터 장부와 다르다. {CO} 중대장은 ‘알아서 맞춰 놔’라고만 하고 퇴근했다.",c:[
["밤을 새워 서류를 직접 정리한다",-8,-3,7,"","사흘 밤을 창고에서 보냈다. 마지막 수량이 맞는 순간 창밖이 밝아 왔다. 검열관은 서류철을 넘기며 ‘서류 깨끗하네’ 한마디만 남겼다."],
["병사들과 분담해 같이 정리한다",-3,0,2,"","병사들을 조로 나눠 품목을 맡겼다. 다들 투덜대면서도 해냈다. 검열은 통과했다. 그 주 소등 후 생활관은 한동안 조용했다."],
["수량을 장부에 맞춰 적는다",0,-5,-10,"nbad","창고를 세는 대신 장부 숫자를 창고에 맞춘 척 적었다. 검열은 통과했다. 반년 뒤 재물조사에서 그 차이가 드러나 경고를 받았다. 장부와 창고가 다른 말을 한다는 건 처음부터 알고 있었다.",0,1]]},
{id:"n7",a:0,b:9e3,l:1,v:1,if:nw(140,520),t:"[13:20] 야외 기동훈련 이틀째. 급경사를 내려오던 병사가 미끄러지며 발목을 접질렸다. 발목이 금세 퉁퉁 붓는다. 일정은 빠듯하고, 무전기 너머 지휘관은 ‘계속 간다’고만 한다.",c:[
["병사를 후송하고 일정 지연을 보고한다",-1,2,3,"","후송 차량을 부르고 일정 지연을 보고했다. 지휘관은 무전기 너머로 한숨을 쉬었다. 군의관은 엑스레이를 보더니 ‘안 보냈으면 큰일 날 뻔했다’고 했다. 인대가 끊어져 있었다."],
["응급 처치 후 후미에서 같이 걷는다",-6,0,0,"","압박붕대를 감고 병사의 군장을 내가 멨다. 병사는 절뚝이며 끝까지 왔다. 다음 날 그 발목은 두 배로 부어 있었다. 의무대에서 인대 손상 진단이 나왔다."],
["‘괜찮다’는 병사 말을 믿는다",0,-4,-6,"","“괜찮습니다.” 그 말을 믿었다. 병사는 사흘 뒤 의무대에 실려 갔다. 골절이었다. 사고 보고서 맨 아래, 현장 책임자 칸에 내 이름이 올랐다.",0,1]]},
{id:"n8",a:0,b:9e3,l:3,if:nw(160,540),t:"[19:00] 휴가 복귀 마감에서 한 시간이 지났다. 분대원 하나가 아직 들어오지 않았고 휴대폰은 꺼져 있다. 행정반 전화벨이 울린다. 당직사관이다. “너네 분대원 어디냐?”",c:[
["즉시 보고하고 가족에게도 연락한다",0,-2,3,"","즉시 보고하고 병사 어머니께도 전화했다. ‘보고가 너무 이르다’고 {CO} 중대장이 투덜댔다. 병사는 고속도로 정체에 배터리까지 나갔던 거였다. 기록은 깨끗하게 남았다."],
["직접 연락해 위치를 파악한 뒤 보고한다",-2,-1,5,"","동기와 친구들 연락처를 수소문했다. 삼십 분 만에 병사가 휴게소 공중전화로 연락해 왔다. 보고는 정확했고, 위병소에 들어선 병사는 눈이 빨개져 있었다."],
["‘지금 오는 중’이라고 둘러댄다",0,-4,-8,"nbad","“지금 오는 중입니다.” 둘러댔다. 병사는 두 시간 뒤에야 나타났다. 병사의 지각보다 내 허위 보고가 먼저 기록에 올라갔다.",0,2]]},
{id:"n9",a:0,b:9e3,l:0,if:nw(180,560),t:"[20:10] 퇴근 후 간부 숙소. 사이버대학 수강 신청 마감이 이번 주 금요일 자정이다. 노트북을 켜자마자 후배 하사가 문을 두드린다. “선배님, 이번 금요일 당직 한 번만 바꿔 주실 수 있습니까? 동생 결혼식이라서요.”",c:[
["수강 신청을 마치고 당직은 거절한다",0,3,1,"","후배는 서운한 얼굴로 돌아갔다. 금요일 밤 열한 시 오십 분, 수강 신청 완료 화면이 떴다. 첫 학기는 무사히 시작했다."],
["당직을 서 주고 수강은 미룬다",-5,-3,4,"","후배는 몇 번이나 고개를 숙였다. 금요일 밤 당직실에서 수강 신청 마감 시각이 지나갔다. 강의 목록은 한 학기 뒤에도 장바구니에 그대로였다."],
["둘 다 되는 날을 같이 찾아 준다",-2,2,3,"","근무표와 달력을 펴 놓고 같이 들여다봤다. 다른 하사까지 세 사람이 하루씩 돌리니 맞는 날이 나왔다. 수강 신청도, 결혼식도 지켜졌다."]]},
{id:"n10",a:0,b:9e3,l:3,if:nw(200,580),t:"[21:00] 퇴근 후 걸려 온 전화. 수화기 너머 어머니 목소리가 들떠 있다. “이번 주말엔 와야지. 네 생일상 차려 놨다.” 달력을 보니 하필 이번 주말이 분대 사격 평가다.",c:[
["“이번엔 못 갑니다.” 평가에 남는다",-3,-3,5,"","“이번엔 못 갑니다.” 전화기 너머 어머니가 “그래, 알았다.” 하고 먼저 끊었다. 주말 평가에서 분대는 만점을 받았다. 저녁에 생일 축하 문자 한 통이 와 있었다."],
["휴가를 내고 집에 다녀온다",2,8,-3,"","주말에 집에 갔다. 어머니가 생일상 반찬을 세 번 바꿔 내놨다. 사격 평가는 선임 하사가 대신 봐 줬고, 분대 점수는 평소보다 낮았다."],
["영상통화로 마음을 달랜다",0,3,0,"","영상통화로 생일 케이크 촛불을 같이 껐다. 화면 속 어머니는 내 계급장을 괜히 한 번 더 들여다봤다."]]},
{id:"n11",a:0,b:9e3,l:0,v:1,if:nw(220,600),t:"[20:50] 전역을 보름 앞둔 병장 분대원이 행정반 문을 두드린다. 손에 취업 준비 책을 들고 있다. 한참 머뭇거리다 묻는다. “분대장님은 왜 군대에 남으셨습니까?”",c:[
["장단점을 솔직히 다 말해 준다",0,3,5,"nl","월급, 관사, 진급의 무게, 가족과 떨어지는 날들까지 다 말해 줬다. 병사는 한참 생각하다 말했다. “분대장님 같은 분이 계셔서 다행입니다.”"],
["“안정적이라서.” 짧게 대답한다",0,0,-1,"","병사의 표정이 미묘했다. 질문은 더 이어지지 않았다."],
["“남지 마라.” 속마음을 말한다",0,-3,-4,"","“남지 마라. 밖이 더 넓다.” 병사는 대답 없이 경례만 했다. 그 말은 다음 날 {CO} 중대장 귀에도 들어갔다."]]},
{id:"n12",a:0,b:9e3,l:5,if:nw(250,640),t:"[22:30] 밤 열 시 반, 아직 불이 켜진 행정반. 이번 주 일정표엔 당직, 행정, 훈련 계획까지 빈칸이 하나도 없다. 식은 믹스커피 세 잔이 모니터 옆에 줄지어 있다. 후배 하사가 눈치를 보며 묻는다. “제가 좀 도울까요?”",c:[
["일을 나눠 맡기고 점검한다",-2,2,5,"","훈련 계획서 하나를 맡기고 다음 날 같이 점검했다. 후배 하사는 처음 맡은 서류에 밑줄을 쳐 가며 읽었다. 일정표에 여백이 생겼다."],
["‘괜찮다’며 혼자 처리한다",-8,-6,2,"","새벽 두 시에도 행정반 불이 꺼지지 않았다. 금요일에 일은 다 끝났다. 토요일 아침, 몸이 먼저 쓰러져 의무대 침상에서 눈을 떴다."],
["일정 조정을 중대장에게 요청한다",0,3,-2,"","{CO} 중대장이 일정표를 한참 보다 볼펜을 내려놓았다. “이건 사람 하나가 하는 일정이 아니네.” 당직 두 개가 다른 간부에게 넘어갔다."]]},

const UA=[
UF(0,0,"ua0",40,3,"[08:40] 서울 도심 경호 지원 작전. 행사 시작 이십 분 전, 사전 점검을 돌다가 행사장 진입로 한가운데 맨홀 뚜껑 하나가 살짝 들떠 있는 게 눈에 들어온다. 무전기에선 ‘차량 행렬 출발’ 교신이 흘러나온다.",[
["즉시 통제선을 치고 무전으로 보고한다",-1,0,8,"","삼 분 만에 경호처 직원이 뛰어왔다. 손전등으로 맨홀 안을 비춰 보더니 무전기를 들었다. 행사 차량은 옆 차로로 돌았고, 그날 오후 중대로 격려 전화가 왔다."],
["직접 올라가 밟아 보며 확인한다",-2,-2,2,"","두어 번 굴러 보니 뚜껑은 단단했다. 지나가던 경호 담당 상사가 혀를 찼다. “확인은 하되 몸으로 하지 마라. 그 밑에 뭐가 있었으면 어쩔 뻔했냐.”"],

["두 사람 모두 추천서에 적는다",-2,-1,-2,"","추천란에 두 이름을 나란히 적었다. 인사 담당관이 서류를 되돌려 보내며 한숨을 쉬었다. “원사님, 그건 추천이 아니라 보류입니다.”"]]),
CF("c5",1,2,3,"[11:00] 면회실로 급히 와 달라는 연락. 병사 어머니가 손수건을 쥔 채 앉아 계신다. 아들이 전화로 매일 운다며 다른 부대로 보내 달라고 하신다. 창밖 연병장에서는 그 아들이 족구를 하며 웃고 있다.",[
["아들과 먼저 이야기해 보겠다고 한다",-2,3,5,"","그날 저녁 병사를 따로 불러 두 시간 이야기했다. 집에 아픈 할머니가 계시다고 했다. 병사는 ‘그래도 남겠다’고 했다. 다음 면회 날, 병사 어머니가 반찬통 하나를 더 싸 와서 내 몫이라고 했다."],
["규정을 설명하고 돌려보낸다",0,-2,-2,"","전출 규정을 차근차근 설명했다. 어머니는 고개만 숙이고 면회실을 나섰다. 병사에게는 어머니가 다녀갔다는 말을 전하지 않았다."],
["전출 절차를 즉시 진행한다",0,-1,-4,"","서류는 하루 만에 처리됐다. 병사는 영문도 모른 채 더플백을 메고 떠났다. 생활관 병사들은 그 일을 두고 한동안 내 앞에서 말을 아꼈다."]]),
CF("o1",4,4,1,"[07:00] 소대장으로 부임하고 처음 맞는 소대 훈련. 밤새 만든 계획서를 펼치자, 아버지뻘 선임 부사관이 지도 위 한 곳을 손가락으로 짚는다. “소대장님, 여기는 비 오면 못 건넙니다. 현장에선 계획대로 안 됩니다. 방식을 좀 바꾸시죠.”",[
["경청하고 계획을 현장에 맞게 고친다",-2,2,7,"","선임 부사관과 지도를 펴고 진입로를 다시 그렸다. 훈련은 매끄러웠다. 복귀하는 길에 선임 부사관이 다음 훈련 계획도 같이 짜자고 했다."],
["교범대로 밀어붙인다",-3,-3,-5,"","훈련은 교범대로 진행됐다. 개울 앞에서 소대가 사십 분을 멈춰 섰다. 병사들의 얼굴은 교범에 없는 표정이었다."],
["중대장에게 판단을 묻는다",0,0,0,"","무전으로 중대장에게 물었다. “그건 소대장이 정할 일이다.” 무전망을 듣던 소대원들 앞에서 질문만 기록에 남았다."]],1),
CF("o2",4,5,5,"[07:10] 출근하자마자 걸려 온 경찰서 전화. 소대원 하나가 휴가 중 음주운전으로 접촉 사고를 냈다. 다친 사람은 없다. 중대장이 굳은 얼굴로 말한다. “소대장이 책임져라. 교육은 네가 했잖아.”",[
["책임을 지고 징계를 감수한다",0,-4,3,"nl","병사는 반성문을 썼고 나는 시말서를 썼다. 경고 한 장이 인사 기록에 남았다. 그 뒤로 소대원들은 휴가 출발 전날마다 소대장실 앞에 줄을 서서 ‘다녀오겠습니다’라고 했다.",0,1],
["병사에게 전적으로 책임을 돌린다",0,0,-6,"","“개인의 일탈입니다.” 틀린 말은 아니었다. 보고서는 깔끔했다. 그 병사는 전역할 때까지 내 눈을 보지 않았다."],
["사고 경위를 축소해 보고한다",0,-4,-8,"nbad","‘경미한 교통사고’로 줄여 보고했다. 보고는 매끄러웠다. 며칠 뒤 경찰 수사 기록이 부대로 도착했고, 축소 보고가 사고보다 크게 다뤄졌다.",0,2]]),
CF("o3",4,5,5,"[16:20] 결재 올리기 직전, 서류를 정리하던 행정병이 조심스럽게 말을 꺼낸다. “소대장님, 여기 날짜가 작년으로 돼 있습니다. 그리고 이 표 합계가….” 병사가 지휘관의 서류를 고친 셈이다.",[
["고맙다며 앞으로 먼저 검토를 부탁한다",0,2,4,"","“고맙다. 앞으로 결재 전에 한 번씩 봐 줄래?” 병사의 눈이 커졌다. 그 뒤로 소대 서류 오류가 눈에 띄게 줄었고, 그 병사는 행정 우수 표창을 받았다."],
["표정을 숨기고 그냥 고친다",0,-1,0,"","알았다고만 하고 고쳤다. 그날은 그 병사 얼굴을 제대로 보지 못했다. 서류는 깨끗해졌다."],
["‘네 일이나 해라’ 하고 넘긴다",0,-2,-4,"","“네 일이나 해라.” 병사는 경례만 하고 나갔다. 며칠 뒤 같은 오류가 중대장 결재판 위에서 발견됐다."]]),
CF("m1",6,6,5,"[17:30] {PO:으로} 부임한 지 한 달. 행보관이 봉투 하나를 내민다. 간부들이 매달 사비를 모아 병사 간식을 사는 오래된 관행이란다. 봉투엔 하사들 이름까지 적혀 있다. 대대에선 다들 알면서 모른 척한다.",[
["관행을 끊고 정식 예산에 편성한다",-3,2,6,"","봉투를 돌려주고 복지 예산 편성 서류를 썼다. 서류가 두 배로 늘었고, 한동안 병사들은 간식 대신 결재 서류만 구경했다. 석 달 뒤 정식 예산으로 간식이 들어왔다."],
["눈감고 그냥 낸다",-1,-2,-2,"","봉투에 내 몫을 넣었다. 간식은 계속됐다. 누구도 영수증 이야기를 꺼내지 않았다. 월급날마다 하사들의 표정이 조금씩 어두워졌다."],
["상급 지휘관에게 보고한다",0,0,3,"","대대장이 웃으며 ‘나도 중대장 때 낸 적 있다’며 서류를 덮었다. 관행은 한동안 멈췄다가 다음 분기에 다시 시작됐다."]]),
CF("m2",6,9,1,"[09:00] 상급 부대 평가 일주일 전. 지휘관이 회의실에서 서류를 내민다. 지난달 비 때문에 취소된 야간 훈련을 ‘실시’로 보고하고, 병사들에게 장비를 들려 사진을 찍어 붙이라는 지시다. “다들 이렇게 해. 사진만 있으면 돼.”",[

["시키는 대로 연출한다",0,-5,5,"nbad","병사들에게 야간 위장을 시키고 대낮에 사진을 찍었다. 평가는 만점이었다. 이듬해 감사에서 사진 촬영 시각이 문제가 돼 경고를 받았다. 사진 속 병사들은 그 뒤로 내 앞에서 그 훈련 얘기를 꺼내지 않았다.",0,1],
["익명으로 감사실에 알린다",-1,0,3,"","국방 감사 신고 창구에 익명으로 글을 남겼다. 한 달 뒤 감사관이 내려왔고 지휘관은 다른 부대로 전보됐다. 누구도 누가 알렸는지 말하지 않았다."]]),
CF("m3",7,9,5,"[14:30] 다음 보직을 정하는 면담. 인사 장교가 귀띔한다. “진급하시려면 사령부 참모 자리가 유리합니다. 위에 얼굴도 알리고요.” 그런데 지난 훈련 때 본 병사들의 얼굴이 자꾸 떠오른다. 그들에게 필요한 건 현장을 아는 지휘관이다.",[
["지휘관 보직을 택한다",-5,3,5,"","전방 지휘관 보직을 택했다. 진급선은 한 칸 멀어졌다. 대신 새벽 구보 때마다 맨 앞에서 뛰었고, 석 달 뒤 병사들이 점호에서 내 이름을 외쳤다."],
["참모 보직을 택한다",2,-1,-1,"","사령부 참모실은 따뜻하고 조용했다. 장군들과 엘리베이터를 같이 타는 일이 잦아졌다. 현장 소식은 보고서로만 들렸다."],
["두 자리를 겸직한다",-9,-4,2,"","두 자리를 겸직했다. 새벽마다 두 부서의 불을 마지막으로 끄고 나왔다. 반년 만에 몸무게가 육 킬로그램 빠졌다."]]),
CF("m4",6,9,5,"[16:00] 상급 부서장이 내 부하 장교 하나를 자기 부서로 데려가겠다고 통보해 왔다. 일 잘하는 중위다. 복도에서 마주친 그 중위가 무슨 말을 하려다 입을 다문다. 남고 싶은 얼굴이다.",[
["부하의 뜻을 대신 전하고 막는다",0,2,-3,"","상급 부서장 사무실에 직접 찾아가 부하의 뜻을 전했다. “자네 부하만 사람인가?” 상급자가 눈을 가늘게 떴지만 인사는 막았다. 그날 저녁 그 중위가 커피 두 잔을 들고 사무실로 찾아왔다."],
["좋은 기회라며 보내 준다",0,-2,3,"","“좋은 기회다. 가서 배워라.” 부하는 대답 없이 짐을 쌌다. 송별회 날까지 나한테 먼저 말을 거는 일은 없었다."],
["부하에게 직접 선택하라고 맡긴다",0,1,2,"","부하를 불러 ‘네가 정해라, 내가 책임진다’고 했다. 한참 망설이던 부하가 남겠다고 했다. 상급 부서장에게는 내가 직접 전화로 알렸다. 통화는 일 분도 안 걸렸다."]]),
CF("g1",10,13,5,"[10:00] 국방부 예산 조정 회의. 긴 탁자 끝에 차관이 앉아 있다. 전방 부대 경계 장비 예산을 깎는 안을 두고 위원장이 내 의견을 묻는다. 현장 지휘관들은 반대, 윗선은 이미 찬성으로 기울었다. 모두의 시선이 내 명패에 꽂힌다.",[
["현장 근거를 들어 반대 의견을 낸다",-2,2,2,"honest","전방 초소의 고장 난 감시 장비 사진을 화면에 띄웠다. 삭감 폭은 절반으로 줄었다. 회의가 끝나고 전방 대대장 하나가 복도까지 따라 나와 고맙다고 했다."],
["중립적으로 장단점만 정리한다",0,0,1,"","장단점을 표 하나로 정리해 읽었다. 누구도 불만이 없었고, 누구도 기억하지 않았다. 안건은 원안대로 통과됐다."],
["윗선 뜻에 맞춰 찬성한다",0,-5,3,"","찬성 의견을 냈다. 표결은 순조로웠다. 몇 달 뒤 전방 감시 장비 고장 보고가 올라왔고, 지휘관 회의에서 다들 나를 똑바로 쳐다보지 않았다."]]),
CF("g2",10,13,5,"[08:40] 출근하자마자 감찰실 연락이 왔다. 지난달 장군 관용차를 딸 졸업식에 썼다는 투서가 접수됐다고 한다. 운행 일지엔 그날 운전병 이름까지 적혀 있다. 사실이다.",[
["사실을 인정하고 비용을 변제한다",0,-2,3,"honest","사실을 인정하고 유류비와 운행 비용을 사비로 변제했다. 감찰관은 ‘이건 제도 문제’라며 경고 없이 마무리했다. 딸은 한동안 졸업식 얘기를 꺼내지 않았다."],
["투서한 사람을 찾아 인사 조치를 검토한다",0,-5,-10,"nbad","투서한 사람을 찾으라고 지시했다. 누군가 그 지시를 녹음했다. 녹음 파일은 감찰실을 거쳐 기자에게 갔고, 다음 날 저녁 뉴스에 내 목소리가 그대로 나갔다.",0,2],
["‘관행이었다’고 항변한다",0,0,0,"",0,0,0,GB(0.45,"“역대 지휘관들도 다 그렇게 했습니다.” 감찰관은 ‘제도 개선 권고’로 정리했다. 기사는 한 줄도 나지 않았다.",[0,2,0],"감찰관이 수첩을 덮었다. 결과 보고서에 내 말이 그대로 인용됐는데, ‘관행’이라는 단어에만 따옴표가 붙어 있었다.",[0,-2,-4])]]),
CF("g3",11,13,5,"[21:30] 관사 서재. 동기 {K1}의 납품 비리 정황이 담긴 서류가 책상 위에 펼쳐져 있다. 위관 시절 훈련 사고 현장에서 내 책임까지 떠안아 준 은인이다. 휴대폰에 {K1}의 부재중 전화가 두 통 찍혀 있다.",[
["은혜는 은혜, 감찰에 사실을 넘긴다",0,-5,6,"honest","다음 날 아침 서류를 그대로 감찰실에 넘겼다. 감찰은 신속했고 {K1:은} 보직 해임됐다. 그날 밤 {K1}에게서 전화가 세 번 왔다. 받지 않았다."],
["당사자를 불러 자진 신고를 권한다",0,0,2,"","{K1:을} 관사로 불러 서류를 보여 줬다. 한참 서류만 보던 {K1:이} 말했다. “네가 알았으면 끝난 거지.” 자진 신고서와 전역 지원서가 이튿날 함께 올라왔다."],
["못 본 척 넘어간다",0,-6,-8,"nbad","서류를 서랍에 넣고 잠갔다. 몇 달 뒤 사건이 터졌다. 수사 결과 보고서 맨 아래 ‘인지 후 미조치’ 칸에 내 이름이 있었다.",0,2]]),
CF("g4",10,13,1,"[16:20] 연합훈련 사흘째, 도하 훈련 중 장갑차가 전복됐다. 병사 둘이 다쳤다. 상급 기관은 오늘 안에 책임자를 보고하라고 한다. 초안엔 현장 대대장 한 명의 이름만 적혀 있다. 사고 직후 직접 물에 뛰어든 사람이다.",[

CF("sl2",5,5,5,"[11:00] 위병소에서 연락이 왔다. 부대 인근 마을 이장이 면담을 요청한다. 장화에 진흙을 묻힌 채 들어온 이장이 모자를 벗으며 말한다. 사격장 소음 때문에 축사 소들이 예민해져 송아지를 낳지 못한다고. 벌써 두 마리째라고 한다.",[
["직접 축사를 찾아가 사정을 듣는다",-2,1,4,"","이장 트럭을 타고 직접 축사에 갔다. 소들이 사격 소리가 날 때마다 우리 안을 맴돈다고 했다. 사격 시간을 오전으로 몰아 조정했고, 한 달 뒤 이장이 부대로 사과 한 상자를 보냈다."],
["“작전상 어쩔 수 없습니다.” 원칙을 설명한다",0,1,-2,"","“작전상 어쩔 수 없습니다.” 이장은 모자를 다시 쓰고 고개를 저으며 돌아갔다. 다음 주 지역 신문에 ‘군부대 소음에 축산 농가 피해’ 기사가 실렸다."],
["상급 부대 민원 창구로 넘긴다",0,2,0,"","민원 접수증을 써 드리고 상급 부대 창구로 넘겼다. 민원은 서류가 되어 올라갔다. 답장은 두 달 뒤에 왔다. 그사이 송아지 한 마리가 더 죽었다고 했다."]]),
CF("sj1",7,7,5,"[14:40] {PO:으로} 부임한 지 이 주. 대대장이 해외 연수를 떠나며 말했다. “큰일 아니면 연락하지 마라.” 이틀 뒤 오후, 무전이 울린다. 행군 훈련 중 병사 한 명이 의식을 잃고 쓰러졌다.",[
["즉시 지휘관에게 보고한다",0,-1,4,"","시차를 무시하고 대대장에게 전화를 걸었다. 전화기 너머에서 한숨이 들렸다. ‘잘했다. 이런 게 큰일이다.’ 병사는 탈진이었고 이틀 만에 회복했다."],
["내 선에서 처리하고 나중에 보고한다",-2,2,-2,"","후송부터 가족 연락까지 내 선에서 처리했다. 처리는 깔끔했다. 사흘 뒤 귀국한 대대장의 표정이 굳었다. ‘이걸 왜 이제 말하나.’"],
["훈련을 전면 중단하고 안전 점검부터 한다",-1,1,2,"","대대 전 훈련을 멈추고 의무 지원과 휴식 기준부터 점검했다. 점검이 끝날 때까지 훈련장이 비었다. 평가 일정은 일주일 밀렸지만, 더 쓰러진 사람은 없었다."]]),
CF("sj2",7,7,5,"[10:00] 군단 합동 계획 회의. 다른 부대 소령이 단상에 올라 작전 계획을 발표한다. 화면에 뜬 기동로 그림이 낯익다. 지난주 실무 협의 때 내가 그려 넘겨준 그 그림이다. 표지엔 그의 이름만 적혀 있다.",[
["회의가 끝난 뒤 따로 바로잡아 달라고 한다",0,-1,3,"","회의가 끝나고 복도에서 그를 붙잡았다. 그는 얼굴이 붉어지더니 다음 회의에서 ‘공동 작성’이라고 고쳐 말했다."],
["그 자리에서 원본 파일을 띄워 정정한다",0,3,-2,"honest","손을 들고 노트북을 연결해 원본 파일의 속성 창을 띄웠다. 작성자, 작성 시각. 회의실이 술렁였다. 파일이 모든 걸 말해 줬다. 그와는 다시 말을 섞지 않았다."],
["그냥 넘긴다",0,-3,1,"","계획은 그대로 통과됐다. 공은 그의 근무평정에 적혔다. 대신 적은 만들지 않았다."]]),
CF("st1",8,8,5,"[18:30] {PO:으로} 부임한 첫 주. 전임자의 인수인계서 ‘인사 특이사항’ 칸엔 ‘없음’ 두 글자뿐이다. 그런데 병사 면담 첫날, 생활관이 서로 다른 병사 셋의 입에서 같은 간부 이름이 나왔다. 셋 다 그 이름을 말할 때 목소리가 작아졌다.",[
["해당 간부를 업무에서 빼고 조사를 지시한다",-2,-2,6,"nl","해당 간부를 보직에서 빼고 감찰 조사를 지시했다. 조사 결과 보고서는 인계서보다 두꺼웠다. 다음 주부터 병사들이 면담 시간에 먼저 와서 기다렸다."],
["간부를 불러 직접 경고만 한다",0,1,2,"","그 간부를 불러 직접 경고했다. 간부는 ‘오해’라며 웃었다. 석 달 동안은 조용했다. 넉 달째에 같은 이름이 다시 나왔다."],
["전임자에게 먼저 사정을 묻는다",0,2,-1,"","전임 대대장에게 전화를 걸었다. 전임자는 ‘그 친구 일은 잘한다’고만 했다. 전화를 끊고 나니 질문만 더 늘어 있었다."]]),
{...CF("st2",8,8,1,"[15:00] 기상 특보가 떴다. 오늘 밤부터 시간당 오십 밀리미터 폭우. 예정된 이틀짜리 야외 숙영 훈련은 대대 평가 항목이다. 지도 위 숙영지 표시는 물이 금방 불어나는 계곡 바로 옆이다. 출발은 두 시간 뒤다.",[
["훈련을 연기하고 숙영지를 옮긴다",0,2,1,"","훈련을 연기하고 다음 주 고지대로 숙영지를 옮겼다. 그날 밤 계곡물이 원래 텐트 자리까지 차올랐다. 평가 점수는 깎였지만 다친 사람은 없었다."],
["장소만 고지대로 바꿔 강행한다",-4,-1,5,"","숙영지를 능선 위 고지대로 바꿔 출발했다. 밤새 진흙탕이었지만 훈련은 끝났다. 평가관이 평가표 여백에 ‘판단이 빨랐다’고 적었다."],
["계획대로 강행한다",0,0,0,"",0,0,0,GB(.5,"비는 예보보다 약했다. 계곡물은 무릎 아래에서 멈췄다. 훈련은 만점이었다. 운이 좋았다는 걸 나만 알았다.",[-2,1,5],"새벽 두 시, 불어난 계곡물에 텐트 하나가 떠내려갔다. 병사들이 서로 손을 잡고 빠져나왔다. 다친 사람은 없었지만 사고 보고서는 두꺼웠다.",[-4,-5,-8,1])]]),if:s=>s.nco&&s.cr==8&&!wn(s.d)},
CF("sk1",9,9,5,"[21:00] 연대장실, 예하 대대장 근무평정서를 쓰는 밤. 훈련 성과 1위 대대장의 서류를 펼친다. 사격, 검열, 체력 모두 최상위다. 그런데 그 대대의 소원수리 건수도 연대 1위다. 그는 다음 달 진급 심사를 앞두고 있다.",[
["성과와 평판을 모두 적는다",0,-1,4,"honest","성과와 소원수리 내용을 모두 적었다. 평가서는 두 장이 됐다. 그는 진급 심사에서 면담을 한 번 더 받았고, 그 대대 소원수리함은 다음 달부터 조금씩 비었다."],
["성과만 적는다",0,2,0,"","성과 칸만 빽빽하게 채웠다. 그는 무난히 다음 계급으로 갔다. 그 대대 소원수리함은 여전히 꽉 차 있었다."],
["그를 불러 평판부터 고칠 시간을 준다",-1,1,3,"","그를 연대장실로 불러 소원수리 내용을 보여 줬다. 그는 한참 말이 없더니 ‘석 달만 주십시오’ 했다. 석 달 뒤 소원수리함이 눈에 띄게 가벼워졌다."]]),
CF("sk2",9,9,3,"[09:40] 부대 창설 기념식 이십 분 전, 연병장 귀빈석 뒤. 지역 국회의원 보좌관이 행사 순서지를 들고 다가온다. 의원님 다음 일정이 급하니 축사를 앞당기고 시간도 늘려 달라고 한다. 그 자리엔 순직 장병 추모 묵념 순서가 있다. 유가족 여섯 분이 이미 앞줄에 앉아 계신다.",[
["묵념은 그대로 두고 정중히 거절한다",0,-1,4,"","묵념 순서는 그대로 두고 정중히 거절했다. 의원은 축사를 짧게 끝내고 먼저 떠났다. 행사가 끝나자 유가족 한 분이 다가와 고맙다고 했다."],
["묵념을 줄여 순서를 맞춘다",0,1,-2,"","행사는 매끄러웠다. 묵념은 축사 직전 삼십 초로 줄었다. 앞줄 유가족들은 묵념이 끝난 줄도 모르고 한참 고개를 숙이고 있었다."],
["의원에게 묵념을 함께해 달라고 부탁한다",0,2,2,"","보좌관을 통해 의원에게 묵념을 함께해 달라고 부탁했다. 의원이 단상에서 내려와 유가족 옆에 서서 고개를 숙였다. 축사는 원고의 절반이었지만, 그 사진이 다음 날 지역 신문 1면에 실렸다."]]),
CF("sz1",12,12,1,"[17:00] 연합훈련 사흘째, 군단 지휘소. 동맹군 측 장성이 통역을 사이에 두고 제안한다. 오늘 밤 야간 도하 훈련을 한 번 더 추가하자고. 우리 장병들은 이틀 동안 합쳐서 다섯 시간도 못 잤다.",[
["휴식을 보장하고 내일 밤으로 미루자고 제안한다",0,1,3,"","장병 수면 기록표를 내밀며 내일 밤으로 미루자고 했다. 협의는 길었지만 도하는 다음 날 밤에 했다. 사고 없이 끝났고, 동맹군 장성이 수면 기록표를 사진으로 찍어 갔다."],
["동맹군 요청대로 오늘 밤 진행한다",-2,-3,4,"","도하는 성공했다. 동맹군 연락장교가 ‘굿 잡’을 연발했다. 복귀 버스 안에서 장병 절반이 선 채로 졸았다."],
["예비 병력만 투입한다",0,2,0,"","훈련은 반쪽짜리가 됐지만 쓰러진 사람은 없었다. 동맹군 장성은 강평에서 그 부분을 짧게 언급하고 넘어갔다."]]),
{...CF("sz2",12,12,1,"[02:10] 새벽 두 시, 군단 상황실. 부대 인근 야산에서 시작된 산불이 강풍을 타고 마을 쪽으로 번지고 있다. 군청에서 병력 지원 요청 공문이 팩스로 들어온다. 다음 주가 상급 부대 검열이다.",[
["가용 병력을 즉시 투입한다",-3,1,6,"hero","가용 병력 천이백 명을 투입했다. 장병들이 동틀 때까지 삽으로 방화선을 팠다. 불은 마을 뒷산에서 멈췄다. 검열은 미뤄졌고, 이장이 부대 정문에 감사 현수막을 걸었다."],
["최소 인원만 보내고 검열을 준비한다",0,1,1,"","최소 인원만 보내고 검열 준비를 계속했다. 검열 결과는 ‘우수’였다. 저녁 뉴스엔 다른 부대 장병들이 불길 앞에 선 장면만 나왔다."],
["상급 부대 지시를 기다린다",0,-3,-3,"","상급 부대 지시를 기다렸다. 지시는 세 시간 뒤에 왔다. 그 사이 불은 산 하나를 더 넘었고, 창고 두 채가 탔다."]]),if:s=>s.nco&&s.cr==12&&(m=>m<5||m>7)(mo(s.d))},
CF("sd1",13,13,5,"[14:00] 국회 국방위원회 전체회의. 증인석 마이크에 빨간 불이 켜진다. 한 의원이 지난달 병사 사망 사고 유가족의 편지를 들어 보이며 묻는다. “이 죽음의 책임은 누구에게 있습니까?” 군 조사는 아직 끝나지 않았다. 방청석에 유가족이 앉아 있다.",[
["“최종 책임은 제게 있습니다.”",0,-3,5,"honest","“최종 책임은 제게 있습니다.” 방청석의 유가족 어머니가 고개를 숙였다. 다음 날 기사 제목에 내 말이 그대로 실렸다."],
["조사 결과를 기다려 달라고 답한다",0,1,1,"","“조사 결과가 나오는 대로 책임을 묻겠습니다.” 답변은 정확했고 기사는 차가웠다. ‘원론적 답변’이라는 말이 붙었다."],
["현장 지휘관의 책임을 언급한다",0,2,-5,"","“현장 지휘관의 관리에 문제가 있었던 것으로 보입니다.” 답변은 짧았다. 그날 밤 예하 지휘관 단체 대화방에는 ‘확인했습니다’만 줄줄이 올라왔다."]]),
CF("sd2",13,13,5,"[10:00] 국방부 장관 주재 회의. 한 달 새 병사 휴대폰으로 인한 보안 사고가 세 건 났다. 장관이 ‘평일 사용 시간 절반 축소’ 안을 화면에 띄운다. 참석자들의 시선이 일제히 내게 향한다. 병사 커뮤니티엔 벌써 소문이 돌고 있다.",[
["시간은 지키고 보안 교육을 강화하자고 한다",-1,1,4,"","시간은 유지하되 보안 앱과 교육을 강화하자고 했다. 장관은 한참 고민하더니 절충안에 서명했다. 다음 날 병사 커뮤니티에 ‘대장님 덕분’이라는 글이 올라왔다."],
["장관안에 찬성한다",0,2,-1,"","안은 통과됐다. 그 주 전군 소원수리함에 같은 문장이 적힌 쪽지가 수백 장 들어왔다. ‘휴대폰 시간 돌려주세요.’"],
["오히려 사용 시간을 늘리자고 한다",0,-1,1,"","“오히려 늘리고 자율에 맡기시죠.” 장관은 웃지 않았다. 안은 보류됐고, 병사들은 이유도 모른 채 안도했다."]]),

Z("zc2","camp",0,0,"관물대 정리","[20:30] 내무 검사 삼십 분 전. 분대장 훈련병이 관물대에 넣는 순서를 딱 한 번 보여 준다. 한 칸이라도 틀리면 생활관 전체가 다시 한다.",
 {k:"sq",sym:["전투복","활동복","수건","세면백"],r0:3,rmax:6,sh:620,h:"불이 들어온 순서대로 누른다"},
 ["소대장이 내 관물대 앞에서 멈췄다. “이게 기준이다. 다들 와서 봐.” 생활관 스물네 명이 줄을 서서 내 관물대를 구경했다.","중간에 한 번 헷갈렸지만 검사는 넘겼다.","수건이 전투복 위에 올라가 있었다. 생활관 전체가 관물대를 처음부터 다시 정리했다. 그날 밤 동기 몇 명이 내 쪽으로 돌아누웠다."]),
Z("zc3","camp",0,0,"아침 점호","[06:00] 아침 점호. 소대장이 훈련병 번호를 무작위로 부른다. 내 번호는 213번. 남의 번호에 대답하거나 내 번호에 늦으면 앞으로 불려 나간다.",
 {k:"re",n:3,sig:["“이백십삼 번!”","“213번!”","“이백십삼!”"],wt:["“백팔 번!”","“이백삼 번!”","“삼백십이 번!”","“이백삼십일 번!”"],ti:"아침 점호",bt:"“예!”",gc:"#2f5a8a",h:"내 번호가 뜨는 순간 누른다"},
 ["세 번 다 번호가 끝나기도 전에 대답이 나갔다. 소대장이 피식했다. “213번, 귀 하나는 좋네.”","한 번 늦었다. “213번, 대답이 졸리다.” 그 정도로 끝났다.","남의 번호에 ‘예!’를 외쳤다. 앞으로 불려 나가 팔굽혀펴기 스무 개를 했다."]),
Z("zc4","camp",0,0,"아침 뜀걸음","[07:00] 비 그친 다음 날 아침 뜀걸음. 연병장 곳곳이 흙탕물 웅덩이다. 전투화가 젖으면 하루 종일 축축하다.",
 {k:"dg",ob:["웅덩이","웅덩이","돌부리"],ti:"아침 뜀걸음",sky:"#5a4a32",c1:"#6b5a3c",c2:"#625236",oc:"#3f5b7a",T:12000,h:"◀ ▶로 웅덩이를 피한다"},
 ["전투화 앞코에 흙 한 점 안 묻었다. 점호 때 조교가 내 전투화를 내려다보고 그냥 지나갔다. 그게 칭찬이다.","한 번 첨벙했다. 양말 한 짝이 저녁까지 질척였다.","웅덩이를 골라 밟은 것처럼 다 밟았다. 저녁 내내 전투화를 빨았고 다음 날 아침에도 덜 말라 있었다."],
 [[-1,3,3],[-1,1,1],[-2,-2,-1]]),
Z("zc5","camp",0,0,"보급품 지급","[14:00] 보급품 지급. 창고 앞 줄이 길다. 보급병이 치수를 외치며 물건을 던져 준다. 남의 짐을 받아 들면 그 주인 찾는 것도 내 일이 된다.",
 {k:"ct",gd:["전투화","전투복","속옷","양말"],bd:["남의 짐","파손품"],bn:"남의 짐",ti:"보급품 지급",sky:"#3a3a2e",oc:"#c9b37a",T:12000,h:"내 물건만 받는다"},
 ["하나도 안 떨어뜨리고 다 받았다. 뒷줄에서 누가 ‘골키퍼 했냐’고 물었다.","몇 개는 떨어뜨려서 주워 담았다. 전투화 끈에 흙이 묻었다.","남의 짐을 받아 들고 생활관까지 갔다. 주인을 찾느라 저녁 시간을 다 썼다."]),
Z("zc6","camp",0,0,"양말 짝 맞추기","[19:30] 단체 세탁이 끝난 건조실. 번호를 써 둔 양말 열두 짝이 한 바구니에 섞여 있다. 점호 전까지 짝을 맞춰 나눠 줘야 한다.",
 {k:"pr",it:["108번","113번","205번","213번","307번","311번"],ti:"양말 짝 맞추기",T:45000,h:"같은 번호끼리 짝을 찾는다"},
 ["점호 오 분 전에 다 나눠 줬다. 동기들이 자기 양말을 받아 가며 한마디씩 했다. “너 세탁 당번 체질이다.”","두어 짝은 헷갈렸지만 점호 전에 나눠 줬다.","끝까지 짝이 안 맞는 양말이 남았다. 다음 날 아침 내가 짝짝이 양말을 신고 연병장에 섰다."]),
Z("zc7","camp",0,0,"예령과 동령","[15:00] 제식 훈련. 조교가 구령을 일부러 끊어서 부른다. 예령에 몸이 먼저 나가면 그 자리에서 얼차려다.",
 {k:"rx",cat:["따른다","가만히"],n:10,tl:[2600,1500],it:[["“차렷!”",0],["“열중쉬어!”",0],["“우향우!”",0],["“제자리에 섯!”",0],["“뒤로 돌아!”",0],["“앞으로…”",1],["“좌향…”",1],["“뒤로…”",1],["“우로 나란…”",1],["“앉아… 말고!”",1]],h:"동령에만 움직인다"},
 ["한 번도 안 속았다. 조교가 ‘너 군대 다녀왔냐’고 물었다. 다녀왔으면 여기 있을 리가 없다.","두어 번 몸이 먼저 나갔다. 다행히 조교가 다른 줄을 보고 있었다.","‘앞으로’에 혼자 세 걸음을 걸어 나갔다. 분대 전체가 앉았다 일어서기를 스무 번 했다."]),
Z("zc8","camp",0,0,"화생방 실습","[11:00] 화생방 실습. 가스실 안에서 방독면을 벗고 군번을 외쳤다. 눈물 콧물이 쏟아져 앞이 하나도 안 보인다. 출구 쪽으로 더듬어 나가야 한다.",
 {k:"mz",W:7,H:4,fog:1,T:22000,ex:"출구",sky:"#1d2a1d",fl:"#32402e",wc:"#9fb08f",h:"◀ ▲ ▼ ▶로 출구를 찾는다"},
 ["맨 먼저 문을 밀고 나왔다. 조교가 생수 한 병을 머리 위에 부어 줬다.","벽에 두어 번 부딪혔지만 나왔다. 콧물은 저녁까지 멈추지 않았다.","한참을 벽만 더듬었다. 결국 조교가 방탄모를 잡아끌고 나왔다. 그날 저녁밥까지 매웠다."],
 [[-1,3,3],[-1,1,1],[-2,-2,-1]]),
Z("zc9","camp",0,0,"팔굽혀펴기 측정","[16:00] 수료 전 체력 측정, 팔굽혀펴기 2분. 옆 줄 동기가 벌써 쉰 개를 넘겼다는 소리가 들린다.",
 {k:"ms",T:8000,per:6,dec:14,bt:"하나 더!",lab:"팔굽혀펴기",col:"#e8c63a",gd:"#7d7a5a",h:"연타해서 게이지를 끝까지"},
 ["특급 기준을 넘겼다. 측정 조교가 숫자를 적고 한 번 더 세어 봤다.","1급. 마지막 열 개는 팔이 떨려서 몇 개인지 셀 수가 없었다.","서른 개에서 팔이 풀렸다. 조교가 기록지 비고란에 ‘자대 가서 꼭 할 것’이라고 적었다."],

Z("zc10","camp",0,0,"영점 사격","[09:30] 영점 사격장. 엎드려쏴 자세로 표적을 겨눈다. 숨을 쉴 때마다 가늠쇠가 위아래로 출렁인다.",

 ["탄착군이 동전 하나에 다 들어갔다. 조교가 표적지를 들고 가서 옆 사로에 보여 줬다.","탄착군이 주먹만 했다. 영점은 잡혔다.","탄착이 표적지 밖으로 흩어졌다. 재사격 명단 맨 위에 이름이 올라갔다."]),
Z("zc11","camp",0,0,"모포 각 잡기","[21:00] 취침 점호 전 모포 각 잡기. 접은 모서리가 한 줄로 맞아야 ‘칼각’이다. 어긋나면 조교가 모포를 침상 밖으로 던진다.",
 {k:"st",N:7,w0:118,v0:100,dv:12,bt:"접는다!",ti:"모포 각",bc:"#7a7f5c",gd:"#5a4a32",h:"아래층에 딱 맞춰 접는다"},
 ["모서리가 자로 잰 듯했다. 점호 때 조교가 손바닥으로 모포 위를 쓸어 보더니 다음 침상으로 넘어갔다.","조금 삐뚤었지만 던져지지는 않았다.","조교가 모포를 침상 밖으로 던졌다. 두 번 다시 접었고 두 번 다 던져졌다."]),

Z("ze1","enl",1,2,"모내기 대민지원","[09:00] 모내기철 대민지원. 논둑에 선 이장님이 못줄을 팽팽히 당긴다. “빨간 표시마다 하나씩, 줄 맞춰서!”",

Z("ze2","enl",1,3,"홋줄 던지기","[09:00] 입항 준비. 갑판장이 홋줄 뭉치를 건넨다. “부두 계류주에 한 번에 걸어라. 바다에 빠뜨리면 네가 건져 와.”",
 {k:"tm",n:5,lab:["1번 홋줄","2번 홋줄","3번 홋줄","4번 홋줄","5번 홋줄"],w0:46,dw:3,v0:130,dv:15,bt:"던진다!",sky:"#9cc3dc",gd:"#2f5a8a",ac:"#c9362b",h:"막대가 붉은 칸에 올 때 던진다"},
 ["다섯 가닥이 한 번에 걸렸다. 갑판장이 ‘오늘 저녁 당직 빼 준다’고 했고, 진짜 빼 줬다.","두어 번 바다에 빠뜨렸지만 결국 다 걸었다. 젖은 홋줄은 두 배로 무거웠다.","홋줄이 연달아 바다에 빠졌다. 부두의 수병들이 결국 손으로 끌어 올렸고, 나는 저녁 내내 홋줄을 말렸다."],

Z("ze3","enl",1,3,"활주로 이물질 제거","[08:30] 활주로 이물질 제거 작전. 장병 전원이 활주로에 한 줄로 늘어서서 걷는다. 볼트 하나가 엔진에 들어가면 전투기 한 대가 선다.",
 {k:"wm",gd:["볼트","너트","자갈","철사"],bd:["페인트","그림자","얼룩"],un:"이물질",ti:"FOD 워크다운",sky:"#59606b",gc:"#c9362b",bc:"#6c737f",h:"이물질만 골라 줍는다"},
 ["내 봉투가 제일 무거웠다. 정비 반장이 ‘볼트 하나가 엔진 하나’라며 PX에서 냉동을 하나 사 줬다.","몇 개는 뒷사람이 주웠다. 이상 없이 끝났다.","내가 지나간 자리에서 볼트가 나왔다. 반장이 내 이름을 수첩에 적었다."],
 0,s=>s.br==3),
Z("ze4","enl",1,3,"철책 말뚝","[10:00] 철책 보수 작업. 폭우에 쓸려 나간 구간에 새 말뚝을 박는다. 분대장이 말뚝을 잡아 주며 말한다. “손 날아가니까 한 번에 쳐.”",
 {k:"tm",n:5,lab:["1번 말뚝","2번 말뚝","3번 말뚝","4번 말뚝","5번 말뚝"],w0:46,dw:3,v0:130,dv:15,bt:"내리친다!",sky:"#a3b6a0",gd:"#5a6b3c",ac:"#c9362b",h:"막대가 붉은 칸에 올 때 내리친다"},
 ["말뚝 다섯 개가 한 줄로 섰다. 소대장이 줄자를 대 보더니 그대로 사진을 찍어 보고했다.","몇 번 헛방망이질을 했지만 말뚝은 다 박혔다. 분대장 손도 무사했다.","말뚝이 비스듬히 들어갔다. 분대장이 다 뽑고 다시 박았다. 작업이 한 시간 늘었다."],

Z("ze5","enl",1,2,"군가 경연대회","[19:00] 부대 군가 경연대회. 분대별로 강당 무대에 선다. 심사위원석의 {HB} 행보관이 팔짱을 끼고 박자를 센다.",

  win:[["“…분대 호흡이 제일 좋았다. 1등.”","분대 전원에게 포상휴가 하루가 나왔다. 그날 밤 생활관에서 그 군가가 열 번은 더 나왔다."],["“그래, 그게 군가다.”","2등. 상품은 PX 상품권 한 장이었다. 분대장이 그걸로 냉동을 사서 돌렸다."]],
  lose:[["“박자가 다 따로 노네.”","꼴찌였다. 다음 날 아침 점호에서 그 군가를 세 번 불렀다."],["“다음엔 연습 좀 하고 와라.”","강당을 내려오는 길에 분대장이 한숨을 쉬었다. 연습은 다음 주부터 매일 저녁으로 잡혔다."]],wd:[0,3,3],ld:[0,-2,-2]}),
Z("ze6","enl",1,3,"제설 작전",s=>SHIP(s)?"[06:10] 밤새 함정 갑판에 눈이 쌓였다. 갑판장이 외친다. “아침 식사 전까지 갑판 끝까지 길 낸다!”":s.br==3?"[05:30] 밤새 활주로에 눈이 쌓였다. 첫 비행 전까지 활주로를 열어야 한다. 반장이 외친다. “제설 삽 들고 전원 활주로로!”":"[06:10] 밤새 무릎까지 눈이 쌓였다. {HB} 행보관이 연병장 한가운데 서서 외친다. “아침 식사 전까지 끝까지 길 낸다!”",
 {k:"ms",T:8000,per:6,dec:14,bt:"삽질!",lab:"제설",col:"#eef4f7",sky:"#c5d3db",gd:"#eef2f2",h:"연타해서 길을 끝까지 낸다"},
 [s=>SHIP(s)?"아침 식사 전에 갑판 끝까지 길이 났다. 갑판장이 믹스커피를 타 와서 내 손에 쥐여 줬다.":s.br==3?"첫 비행 전에 활주로가 열렸다. 이륙하는 전투기 소리가 그날따라 듣기 좋았다.":"아침 식사 전에 끝까지 길이 났다. {HB} 행보관이 믹스커피를 타 와서 내 손에 쥐여 줬다.",
  s=>s.br==3?"첫 비행이 조금 늦춰졌지만 활주로는 열렸다. 허리가 뻐근했다.":"점호 직전에야 길이 이어졌다. 허리가 뻐근했다.",
  s=>s.br==3?"제설이 안 끝나서 오전 비행이 취소됐다. 원망은 내 삽으로 모였다.":"길은 반쯤에서 끊겼다. 아침 식사가 이십 분 늦어졌고, 원망은 내 삽으로 모였다."],
 [[-3,3,3],[-3,1,1],[-4,-2,-2]],s=>wn(s.d)),
Z("ze7","enl",1,3,"영상 모의 사격","[14:00] 영상 모의 사격 훈련장. 스크린에 사람이 무작위로 튀어나온다. 적이면 쏘고, 아군이나 민간인이면 손가락을 뗀다. 갈수록 빨라진다.",
 {k:"rx",cat:["사격","사격 중지"],n:10,tl:[2800,1600],it:[["적 소총수",0],["적 기관총 사수",0],["적 저격수",0],["적 척후병",0],["적 무전병",0],["아군 의무병",1],["아군 통신병",1],["손 든 민간인",1],["자전거 탄 민간인",1],["아군 소대장",1]],h:"적이면 사격, 아니면 중지"},
 ["열 번 중 아홉 번 넘게 맞혔다. 통제관이 기록지 비고란에 ‘침착함’이라고 적었다. 소대에서는 ‘매의 눈’이라는 별명이 붙었다.","몇 번 손가락이 먼저 나갔지만 합격선은 넘겼다.","스크린 속 민간인에게 탄착 표시가 찍혔다. 통제관이 화면을 멈추고 그 장면을 세 번 돌려 봤다."]),
Z("ze8","enl",3,3,"족구 결승","[16:00] 부대 족구 대회 결승, 세트 스코어 1 대 1. 전역을 석 달 앞둔 마지막 대회다. 중대원들이 네트 뒤에서 숨을 죽인다.",
 {k:"tm",n:5,lab:["서브","공격 1","공격 2","공격 3","매치 포인트"],w0:44,dw:3,v0:140,dv:16,bt:"찬다!",sky:"#9cc3dc",gd:"#c2a86b",ac:"#e8c63a",h:"막대가 노란 칸에 올 때 찬다"},
 ["마지막 공이 상대 코트 구석에 꽂혔다. 우승. 후임들이 나를 헹가래 쳤고, 포상휴가 4박 5일이 걸렸다.","접전 끝에 준우승. 대대장이 시상하면서 ‘말년이 제일 열심히 뛰었다’고 했다.","공이 연달아 네트에 걸렸다. 결승은 졌다. 말년 병장 다리는 생각보다 정직했다."],
 [[-1,3,3],[-1,1,1],[-2,-2,-2]]),
Z("ze9","enl",3,3,"마지막 체력 검정","[07:30] 전역 전 마지막 체력 검정, 3km 달리기 마지막 바퀴. 특급 기준까지 남은 시간이 빠듯하다.",
 {k:"ms",T:8000,per:6,dec:15,bt:"달린다!",lab:"마지막 바퀴",col:"#e8c63a",gd:"#b5653a",h:"연타해서 끝까지 달린다"},
 ["결승선 시계가 특급 기준 오 초 전에 멈췄다. 숨이 넘어갈 것 같았는데 웃음이 났다.","1급. 특급엔 조금 모자랐다. 말년 병장치고는 잘 뛰었다는 말은 들었다.","마지막 바퀴에서 다리가 풀렸다. 기록지엔 ‘3급’ 두 글자가 적혔다."],
 [[-4,3,3],[-4,1,1],[-5,-2,-2]]),
Z("ze10","enl",0,2,"전투화 짝 찾기","[19:00] 비 온 다음 날 건조실. 생활관 전투화가 한데 뒤엉켜 마르고 있다. 깔창에 매직으로 쓴 이름을 보고 짝을 맞춰 침상 앞에 놔야 한다.",
 {k:"pr",it:["{S1n}","{S2n}","{D1n}","{D2n}","{H1n}","{SQn}"],ti:"전투화 짝 찾기",T:45000,h:"같은 이름끼리 짝을 찾는다"},
 ["열두 짝이 다 제자리로 돌아갔다. {S1:이} 자기 전투화를 신어 보더니 ‘너 이거 직업으로 해도 되겠다’고 했다.","한 켤레는 짝이 바뀌었다. 다음 날 아침 {D1:이} 왼발만 꽉 끼는 채로 구보를 뛰었다.","끝까지 짝이 안 맞았다. 점호 때 {S1:이} 짝짝이 전투화를 양손에 하나씩 들고 나를 찾아왔다."]),
Z("ze11","enl",1,3,"총기 반납","[16:40] 사격을 마치고 총기 반납. 무기고 총가 칸마다 총번이 붙어 있다. 순서가 틀리면 무기고 계원이 처음부터 다시 센다.",
 {k:"od",seq:["0412","0417","0423","0438","0451","0466","0472","0489","0495"],ti:"총번 순서대로",par:8,h:"총번이 작은 것부터 누른다"},
 ["한 번에 다 꽂았다. 무기고 계원이 ‘오늘 제일 빨랐다’며 출입 대장 서명을 먼저 받아 줬다.","중간에 하나를 꽂았다 뺐다. 계원이 한숨을 쉬었지만 시간 안에 끝났다.","총번 두 개를 바꿔 꽂았다. 당직사관까지 불려 와서 총기 수를 다시 셌다."]),
Z("ze12","enl",1,3,"정전된 막사","[02:30] 막사 변압기가 나가 정전됐다. 손전등 하나 들고 상황실까지 가서 근무 상황을 보고해야 한다. 막사 복도가 오늘따라 길다.",
 {k:"mz",W:8,H:4,fog:1,T:24000,ex:"상황실",sky:"#0c0f16",fl:"#1d2330",wc:"#8f97ad",h:"◀ ▲ ▼ ▶로 상황실까지"},
 ["삼 분 만에 상황실 문을 열었다. 당직사관이 손전등을 받아 들고 ‘발전기 금방 돈다’고 했다.","몇 번 길을 잘못 들었지만 보고는 했다.","복도 끝 창고에서 한참 헤맸다. 결국 당직사관이 손전등을 흔들며 나를 찾으러 나왔다."]),
Z("ze13","enl",1,3,"군대스리가","[16:30] 중대 대항 축구 결승. 공이 내 발에 왔다. 상대 수비 셋이 한꺼번에 달려든다. {HB} 행보관이 사이드라인에서 소리친다. “뚫어!”",
 {k:"dg",ob:["태클","태클","수비"],ti:"군대스리가",sky:"#3f6b3a",c1:"#4a7a43",c2:"#447240",oc:"#c9362b",T:12000,h:"◀ ▶로 태클을 피한다"},
 ["수비 셋을 다 제치고 넣었다. 그날 저녁 PX 냉동은 진 중대가 샀다.","두어 번 걸렸지만 공은 지켰다. 동점으로 끝났다.","태클에 세 번 걸려 넘어졌다. 무릎에 붙인 밴드가 일주일을 갔다."],
 [[-1,3,3],[-1,1,1],[-3,-2,-1]]),
Z("ze14","enl",0,2,"부식 수령","[06:40] 부식 차량이 왔다. 트럭 짐칸에서 취사병이 상자를 하나씩 던져 내린다. 떨어뜨리면 오늘 저녁 반찬이 하나 빠진다.",
 {k:"ct",gd:["계란","두부","양파","우유"],bd:[],ti:"부식 수령",sky:"#3b3f46",oc:"#e8d9b0",T:12000,h:"떨어지는 상자를 받는다"},
 ["계란 한 판도 안 깼다. 그날 저녁 취사병이 내 식판에만 계란말이를 하나 더 올렸다.","두부 한 모가 터졌다. 저녁 국에 두부가 조금 모자랐다.","계란 상자가 바닥에 떨어졌다. 그날 저녁 메뉴판의 ‘계란찜’이 ‘김’으로 바뀌었다."]),
Z("ze15","enl",1,3,"모래주머니 쌓기","[13:30] 진지 보수 작업. 무너진 교통호에 모래주머니를 다시 쌓는다. 비뚤게 쌓으면 다음 비에 또 무너진다.",
 {k:"st",N:8,w0:110,v0:105,dv:13,bt:"올린다!",ti:"모래주머니",bc:"#b39a62",gd:"#5a4a32",h:"아래층에 딱 맞춰 올린다"},
 ["여덟 단이 벽돌처럼 맞물렸다. 소대장이 줄자를 대 보고 ‘이건 내년 장마도 버틴다’고 했다.","조금 기울었지만 무너지지는 않았다.","다섯 단째에서 와르르 무너졌다. 분대 전체가 처음부터 다시 쌓았다. 손바닥에 물집이 잡혔다."],
 [[-2,3,3],[-2,1,1],[-3,-2,-2]]),
Z("ze16","enl",1,3,"냉동 단체 주문","[19:10] 생활관 PX 단체 주문. 막내가 받아 적은 주문서를 내게 넘긴다. 다들 자기 몫이 얼마냐고 묻는다. PX 문 닫기 전에 정산해야 한다.",
 {k:"mt",u:"원",ti:"단체 주문 정산",h:"맞는 금액을 고른다",qs:[()=>{const a=[1500,1800,2200][RI(0,2)],b=RI(2,6);return[`핫바 ${WON(a)}원짜리 ${b}개`,a*b]},()=>{const a=[3200,3500,3800][RI(0,2)],b=[600,700,800][RI(0,2)];return[`냉동 만두 ${WON(a)}원에 음료 ${b}원`,a+b]},()=>{const a=[1200,1500][RI(0,1)],b=RI(3,6),c=[500,1000][RI(0,1)];return[`컵라면 ${WON(a)}원짜리 ${b}개에서 ${WON(c)}원 할인`,a*b-c]}]},
 ["한 푼도 안 틀렸다. 그날부터 생활관 PX 주문은 다 내가 받게 됐다.","한 번 틀려서 내 돈 천 원을 보탰다.","계산이 계속 꼬였다. 휴대폰 계산기를 꺼냈을 땐 PX가 문을 닫은 뒤였다."]),
Z("ze17","enl",2,3,"5분 대기조","[04:10] 이번 주 5분 대기조에 내 이름이 있다. 사이렌이 울리면 완전 군장으로 곧장 뛰어나가야 한다. 오늘 새벽은 불시 점검이 세 번 있다는 소문이다.",
 {k:"re",n:3,sig:["사이렌!","“5분 대기조 출동!”","“비상!”"],wt:["(코 고는 소리)","(시계 초침)","(바람 소리)"],ti:"5분 대기조",bt:"뛰어나간다!",gc:"#b83226",h:"신호가 뜨는 순간 누른다"},
 ["세 번 다 대기조 중 제일 먼저 위병소 앞에 섰다. 당직사령이 시계를 보고 ‘2분 40초’라고 적었다.","한 번은 늦었지만 5분 안에 들어왔다.","방탄모를 거꾸로 쓰고 뛰어나왔다. 기록은 6분 10초. 다음 날 새벽에 또 훈련이 잡혔다."],
 [[-1,3,3],[-1,1,1],[-2,-2,-2]]),
Z("ze18","enl",0,3,"새벽 한 시 모기","[01:20] 열대야. 모기장 찢어진 틈으로 모기가 들어왔다. 귓가에서 앵 소리가 난다. 벽에 붙은 건 다 모기처럼 보인다.",
 {k:"wm",gd:["모기","모기","모기"],bd:["얼룩","못 자국","파리똥"],un:"모기",ti:"새벽 한 시",sky:"#1a1d2a",gc:"#b03a2e",bc:"#3a4054",h:"모기만 잡는다"},
 ["다 잡고 잤다. 아침에 보니 손바닥이 빨갰다. 전부 내 피다.","몇 마리는 놓쳤다. 아침에 이마에 두 방 물려 있었다.","벽만 두드리다 옆 침상 선임을 깨웠다. 모기는 그 선임 피를 먹고 갔다."],

Z("ze19","enl",1,3,"외줄 다리","[10:00] 유격 훈련 셋째 날, 외줄 다리. 계곡 위 밧줄 두 가닥에 손발을 걸고 건너야 한다. 아래에서 조교가 올려다본다. “떨어지면 처음부터!”",
 {k:"hd",T:9000,lab:["◀ 왼쪽으로","오른쪽으로 ▶"],ti:"외줄 다리",zl:"왼쪽으로 기욺",zr:"오른쪽으로 기욺",h:"◀ ▶로 중심을 잡는다"},
 ["한 번도 안 출렁이고 건넜다. 조교가 확성기로 ‘다음 조, 저렇게만 해!’라고 했다.","중간에 크게 흔들렸지만 건넜다.","가운데서 뒤집혀 매달렸다. 밧줄에 쓸린 팔뚝이 일주일 쓰라렸다."],

Z("ze20","enl",0,1,"취사 지원","[10:30] 취사 지원. 조리병이 국자를 휘두르며 재료 넣는 순서를 부른다. 순서가 바뀌면 백 인분 찌개가 망한다.",
 {k:"sq",sym:["양파","대파","고기","간장"],r0:3,rmax:6,sh:600,h:"불린 순서대로 넣는다"},
 ["점심에 찌개를 먹던 대대장이 ‘오늘 누가 끓였냐’고 물었다. 조리병이 내 이름을 댔다.","중간에 순서가 한 번 꼬였지만 맛은 비슷했다.","간장이 두 번 들어갔다. 점심 찌개가 바닷물이 됐다. 식당 뒤 잔반통이 넘쳤다."]),
Z("ze21","enl",0,2,"분리수거 당번","[19:20] 분리수거장 당번. 생활관에서 나온 쓰레기 봉투를 하나씩 갈라야 한다. {HB} 행보관이 금요일마다 검사한다.",
 {k:"rx",cat:["플라스틱","캔","비닐"],n:10,tl:[3200,2000],it:[["생수병",0],["요구르트병",0],["샴푸 통",0],["음료 캔",1],["참치 캔",1],["스팸 캔",1],["과자 봉지",2],["라면 봉지",2],["전투식량 봉투",2],["비닐봉지",2]],h:"알맞은 통을 고른다"},
 ["금요일 검사에서 {HB} 행보관이 분리수거장을 한 바퀴 돌고 ‘이번 주 누구냐’고 물었다. 포상 점수 1점이 붙었다.","몇 개를 다시 옮겼다. 검사는 통과했다.","캔 통에서 과자 봉지가 나왔다. 다음 주 당번도 내 차지가 됐다."]),

Z("zn1","nco",0,1,"총기 분해결합 시범","[10:00] 전투 기술 교육. 병사들 앞에서 총기 분해결합 시범을 보인다. 선임 부사관이 부르는 부품 순서를 한 번 듣고 그대로 집어야 한다.",
 {k:"sq",sym:["노리쇠뭉치","장전손잡이","총열덮개","탄알집"],r0:3,rmax:6,sh:580,h:"불린 순서대로 누른다"},
 ["손이 머리보다 먼저 움직였다. 시범이 끝나자 병사 하나가 ‘한 번만 더 보여 주십시오’ 하고 손을 들었다.","한 번 순서가 꼬였지만 침착하게 다시 맞췄다.","총열덮개를 거꾸로 끼웠다. 맨 앞줄 병사가 ‘하사님, 그거…’ 하고 말끝을 흐렸다."]),
Z("zn2","nco",0,2,"새벽 순찰","[02:10] 당직 부사관 새벽 순찰. 손전등 불빛에 하나씩 드러나는 걸 보고 그냥 둘지, 조치할지 정한다.",
 {k:"rx",cat:["정상","조치"],n:10,tl:[2700,1500],sky:"#111522",it:[["잠긴 총기함",0],["열린 탄약고 문",1],["졸고 있는 불침번",1],["압력 정상인 소화기",0],["켜 둔 채 나간 다리미",1],["반듯한 관물대",0],["비어 있는 초소",1],["잠긴 휴대폰 보관함",0],["복도에 주저앉은 병사",1],["제자리에 있는 소화전",0]],h:"정상인지 조치할지 고른다"},
 ["순찰 일지가 빈틈없이 찼다. 아침 보고에서 당직사령이 내 이름을 한 번 더 확인했다.","한두 개를 놓쳤지만 큰일은 없었다.","놓친 하나가 아침에 발견됐다. 당직 일지의 내 이름 옆에 빨간 줄이 그어졌다."]),
Z("zn3","nco",0,2,"구보 선두","[06:20] 부대 아침 구보, 선두에서 속도를 맞추는 역할을 맡았다. 너무 빠르면 뒤가 끊기고, 너무 느리면 시간 안에 못 들어온다.",
 {k:"hd",T:9000,lab:["◀ 늦춘다","당긴다 ▶"],ti:"구보 속도",zl:"너무 느림",zr:"너무 빠름",h:"◀ ▶로 바늘을 가운데 둔다"},
 ["한 명도 안 처지고 제시간에 들어왔다. 맨 뒤에서 뛰던 이병이 숨을 몰아쉬며 ‘살았다’고 했다.","두어 명이 처졌지만 시간은 맞췄다.","대열이 고무줄처럼 늘어졌다. 낙오자 셋. 당직사관이 기록지를 꺼냈다."],
 [[-2,2,2],[-2,1,1],[-2,-1,-1]]),
Z("zn4","nco",1,2,"응원전","[13:00] 부대 체육대회 계주 결승. 응원단장 완장을 찼다. 관중석의 병사들이 내 구령만 기다린다.",
 {title:"응원전",who:"상대 응원단장",og:1,wl:"응원전 승리",ll:"응원전 패배",wb:"상대 응원단장의 말을 듣는다",lb:"목을 가다듬는다",h:"노트가 분홍 선에 닿을 때 D·F·J·K",
  sen:["목소리가 그게 다야?","우리 쪽이 더 크다!","박자 놓쳤지?","따라올 수 있겠어?","마지막 바퀴다!","관중석 다 졸고 있네?","응원도 실력이다!","이제 끝이다!"],me:["하나 둘 셋!","파이팅!","끝까지!","우리가 이긴다!","목청 높여!","소리 질러!"],
  win:[["“…졌다. 너희 쪽 진짜 크다.”","관중석이 일제히 일어났다. 계주도 이겼다. 응원상 트로피는 행정반 책장 맨 위에 올라갔다."]],
  lose:[["“응원은 우리가 이겼다!”","우리 쪽 관중석이 먼저 지쳤다. 계주는 반 바퀴 차이로 졌다."]],wd:[-1,2,2],ld:[-1,-1,-1]}),
Z("zn5","nco",1,3,"줄다리기 결승","[15:00] 부대 체육대회 마지막 종목, 줄다리기 결승. 부사관 대표로 맨 끝을 잡았다. 상대는 작년 우승팀이다.",
 {k:"ms",T:8000,per:6,dec:15,bt:"당겨!",lab:"줄다리기",col:"#c9362b",gd:"#c2a86b",h:"연타해서 줄을 끌어온다"},
 ["마지막 한 번에 줄이 넘어왔다. 병사들이 나를 들어 올렸다. 부사관이 헹가래를 받은 건 그 부대에서 처음이라고 했다.","한 판씩 주고받다 비겼다. 손바닥에 줄 자국이 사흘 남았다.","줄이 한 번에 넘어갔다. 병사들이 엉덩방아를 찧었다. ‘끝에 선 사람이 가벼웠다’는 농담을 한 달 들었다."],
 [[-2,2,2],[-2,1,1],[-2,-1,-1]]),
Z("zn6","nco",1,3,"분기 재물조사","[09:00] 분기 재물조사. 창고에서 나오는 물품마다 정상, 수리, 불용 중 하나로 장부에 적는다.",
 {k:"rx",cat:["정상","수리","불용"],n:10,tl:[3200,2000],it:[["새것 같은 모포",0],["지퍼 고장 난 침낭",1],["녹슬어 부러진 야전삽",2],["구멍 난 판초우의",1],["포장 그대로인 전투화",0],["밑창 떨어진 전투화",1],["유통기한 지난 전투식량",2],["렌즈 깨진 방독면",2],["멀쩡한 반합",0],["손잡이 빠진 들것",1]],h:"정상·수리·불용을 가른다"},
 ["장부와 창고가 한 줄도 안 어긋났다. 검열관이 ‘이 장부 누가 정리했냐’고 물었다.","몇 개를 다시 분류했지만 장부는 맞았다.","불용품이 정상 칸에 섞였다. 다음 분기 재물조사가 한 번 더 잡혔다."]),
Z("zn7","nco",2,3,"간부 계주","[14:30] 부대 체육대회 간부 계주, 마지막 주자로 섰다. 바통이 손에 닿는 순간을 놓치면 다 끝난다.",
 {k:"tm",n:3,lab:["첫 바통","둘째 바통","마지막 바통"],w0:44,dw:6,v0:145,dv:25,bt:"받는다!",sky:"#9cc3dc",gd:"#b5653a",ac:"#6aa84f",h:"막대가 초록 칸에 올 때 받는다"},
 ["바통이 손에 착 감겼다. 결승선을 통과하자 병사들이 트랙으로 쏟아져 나왔다.","한 번 바통이 손끝에서 미끄러졌다. 2등.","바통이 트랙에 떨어졌다. 줍는 사이 세 팀이 지나갔다."],
 [[-2,2,2],[-2,1,1],[-2,-1,-1]]),
Z("zn8","nco",2,3,"신병 제식 교육","[10:00] 신병 제식 교육. 오늘은 교관 대신 내가 직접 구령을 붙인다. 구령 순서를 한 번 보고 그대로 붙여야 한다.",
 {k:"sq",sym:["차렷","경례","좌향좌","앞으로 가"],r0:3,rmax:6,sh:560,h:"불이 들어온 순서대로 누른다"},
 ["끝날 때까지 신병들 발이 한 번도 안 엇갈렸다. 지켜보던 대대장이 연병장을 가로질러 와서 신병들에게 한마디 했다. “저 부사관 구령이 표준이다.”","한 번 꼬였지만 웃으면서 다시 붙였다. 신병들 어깨가 조금 풀렸다.","‘좌향좌’ 대신 ‘우향우’가 나왔다. 신병 절반이 서로 마주 봤다."]),
Z("zn9","nco",0,2,"탄약 수불","[17:20] 사격이 끝나고 탄약 수불. 지급한 실탄, 쓴 실탄, 돌려받을 실탄이 한 발이라도 안 맞으면 부대 외출이 묶인다.",
 {k:"mt",u:"발",ti:"탄약 수불",h:"맞는 수를 고른다",qs:[()=>{const a=RI(20,40)*10,b=a-RI(3,9)*10;return[`지급 ${a}발, 사용 ${b}발. 반납할 실탄은?`,a-b]},()=>{const n=RI(12,24),k=[6,9,10][RI(0,2)];return[`사수 ${n}명에게 ${k}발씩 지급`,n*k]},()=>{const a=RI(18,30),b=[6,9,10][RI(0,2)];return[`탄알집 ${a}개에 ${b}발씩 장전`,a*b]}]},
 ["한 발도 안 틀리고 수불 대장을 맞췄다. 탄약 담당관이 ‘이번 사격 제일 깔끔했다’며 서명했다.","한 번 다시 셌지만 맞았다.","숫자가 한 줄 어긋났다. 탄피 받이를 다 뒤집어 세느라 저녁 시간이 사라졌다."]),
Z("zn10","nco",0,2,"장비 대장 대조","[09:00] 분기 장비 점검. 야간투시경 여섯 대와 장비 대장을 하나씩 대조해야 한다. 번호가 엇갈리면 감찰이 다시 나온다.",
 {k:"pr",it:["3호기","7호기","11호기","14호기","18호기","22호기"],ti:"장비 대장 대조",h:"같은 번호끼리 짝을 찾는다"},
 ["여섯 대가 다 대장과 맞았다. 점검관이 창고를 한 바퀴 돌더니 ‘여긴 볼 게 없네’ 하고 나갔다.","한 번 헷갈렸지만 맞췄다.","번호 두 개가 뒤바뀐 채 보고됐다. 다음 주 재점검이 잡혔다."]),
Z("zn11","nco",0,3,"당직 일지 정리","[07:40] 당직 근무를 마치고 일지를 정리한다. 밤새 메모지에 흘려 쓴 기록이 뒤죽박죽이다. 시간 순서대로 옮겨 적어야 당직사령 결재가 난다.",
 {k:"od",seq:["18:00 인수","19:30 석식 확인","21:00 점호 준비","22:00 취침 점호","00:30 1차 순찰","02:00 근무 교대","03:30 2차 순찰","06:00 기상","07:30 인계"],ti:"당직 일지",par:11,h:"이른 시각부터 누른다"},
 ["당직사령이 일지를 넘기다 말고 ‘글씨는 엉망인데 순서는 완벽하다’고 했다.","한 줄 고쳐 썼지만 결재는 났다.","순찰 기록이 점호 앞에 들어갔다. 당직사령이 빨간 펜으로 화살표를 세 개 그렸다."]),
Z("zn12","nco",0,2,"탄약고 경보","[23:50] 상황실 당직. 탄약고 경보 패널이 가끔 오작동한다. 진짜 경보가 뜨면 즉시 5분 대기조를 띄워야 한다.",
 {k:"re",n:3,sig:["경보: 탄약고 2번","경보: 후문 철책","경보: 탄약고 1번"],wt:["대기 중","이상 없음","대기 중","점검 신호"],ti:"상황실 경보 패널",bt:"대기조 출동!",gc:"#b83226",h:"경보가 뜨는 순간 누른다"},
 ["세 번 다 경보가 뜨자마자 대기조를 띄웠다. 점검 나온 상급 부대 상황실이 ‘대응 시간 우수’로 적어 갔다.","한 번은 늦었다. 대기조는 그래도 5분 안에 도착했다.","경보도 안 떴는데 대기조를 두 번 띄웠다. 대기조 병사들 얼굴을 한동안 똑바로 못 봤다."]),
Z("zn13","nco",0,3,"정전과 발전기","[01:10] 부대 전체가 정전됐다. 비상 발전기를 직접 돌려야 한다. 발전기실은 막사 뒤 창고 골목 끝이다.",
 {k:"mz",W:8,H:4,fog:1,T:24000,ex:"발전기",sky:"#0c0f16",fl:"#1d2330",wc:"#8f97ad",h:"◀ ▲ ▼ ▶로 발전기실까지"},
 ["사 분 만에 발전기를 돌렸다. 불이 들어오자 생활관에서 누가 ‘와이파이!’ 하고 소리쳤다.","몇 번 헤맸지만 불은 들어왔다.","창고 골목에서 한참 헤맸다. 그사이 당직병이 먼저 발전기를 돌렸다."]),
Z("zn14","nco",0,2,"5톤 트럭 적재","[14:00] 훈련 물자 적재. 5톤 트럭 짐칸에 상자를 쌓는다. 비뚤면 산길 커브에서 다 쏟아진다.",
 {k:"st",N:8,w0:116,v0:105,dv:13,bt:"싣는다!",ti:"5톤 트럭 적재",bc:"#7a6a46",gd:"#3a3f2c",h:"아래층에 딱 맞춰 싣는다"},
 ["여덟 단이 반듯했다. 운전병이 결박끈을 걸며 ‘이건 안 무너진다’고 했고, 진짜 안 무너졌다.","조금 기울었지만 결박끈으로 잡았다.","커브 두 번째에서 상자가 쏟아졌다. 산길 한가운데서 다시 실었다."],
 [[-2,2,2],[-2,1,1],[-2,-1,-1]]),
Z("zn15","nco",0,2,"CCTV 감시","[03:00] 상황실 CCTV 근무. 화면 아홉 개가 번갈아 깜빡인다. 진짜 이상만 골라 보고해야 한다. 헛보고가 쌓이면 다음 날 근무표가 바뀐다.",
 {k:"wm",gd:["사람","월책","차량"],bd:["고라니","바람","나방"],un:"이상",ti:"CCTV 감시",sky:"#0f1420",gc:"#b03a2e",bc:"#2f4a5a",h:"사람·차량만 골라 누른다"},
 ["놓친 게 하나도 없었다. 아침 보고에서 대대장이 상황 일지를 마지막 줄까지 읽었다. 드문 일이다.","한두 개는 늦게 봤다. 큰일은 없었다.","고라니를 세 번 보고했다. 그 주 내내 ‘고라니 보고관’으로 불렸다."]),
Z("zn16","nco",1,3,"간부 대 병사 피구","[15:00] 부대 체육대회, 간부 대 병사 피구. 병사 팀은 공만 잡으면 간부부터 노린다. 오늘 표적은 나다.",
 {k:"dg",ob:["공","공","공"],ti:"간부 대 병사 피구",sky:"#3f6b3a",c1:"#4a7a43",c2:"#447240",oc:"#c9b23a",T:12000,h:"◀ ▶로 공을 피한다"},
 ["마지막까지 살아남았다. 병사들이 ‘{RK}님은 왜 안 맞냐’며 심판에게 항의했다.","두 번 맞았지만 버텼다. 팀은 졌다.","시작하자마자 얼굴에 맞았다. 그 장면이 병사들 사이에서 하루 종일 재방송됐다."],

Z("zj10","jo",4,6,"사격 통제","[10:00] 실탄 사격장 통제관 근무. 사로에서 이상이 보이면 그 즉시 ‘사격 중지’를 외쳐야 한다. 한 박자 늦으면 사고다.",

Z("zj14","jo",4,6,"빙판 행군","[05:00] 혹한기 훈련 철수 행군. 새벽에 내린 눈이 얼어 길이 빙판이다. 소대장이 넘어지면 소대 전체가 멈춘다.",
 {k:"dg",ob:["빙판","빙판","돌"],ti:"빙판 행군",sky:"#c9d3db",c1:"#dfe7ec",c2:"#d4dde3",oc:"#7fa8c9",T:12000,h:"◀ ▶로 빙판을 피한다"},

Z("zf1","fo",7,7,"작전 회의","[08:00] 지휘관 주관 작전 회의. 지휘관이 질문하며 슬라이드를 이리저리 짚는다. 짚은 순서를 한 번 보고 그대로 띄워야 한다.",

 ["브리핑이 끝나자 지휘관이 펜을 내려놓았다. “깔끔하네. 이대로 간다.”","한 번 순서가 꼬였지만 질문으로 잘 메웠다.","엉뚱한 슬라이드가 떴다. 지휘관이 ‘그건 다음 주 회의 자료 아닌가’ 하고 물었다."]),

 ["바퀴가 표시선 한가운데 닿았다. 조종사가 헬멧을 벗고 손을 흔들었다.","조금 비켜 앉았지만 안전하게 내렸다.","헬기가 한 번 다시 떠올랐다. 착륙은 두 번째 시도에서야 됐다."]),
Z("zf3","fo",8,8,"개회 시범 사격","[10:30] 부대 사격 대회 개회 시범 사격. 지휘관인 내가 맨 앞 사로에 엎드렸다. 장병 오백 명이 지켜본다.",
 {k:"tm",n:5,lab:["1발","2발","3발","4발","5발"],w0:42,dw:2,v0:145,dv:15,bt:"격발!",sky:"#9cc3dc",gd:"#7fae5a",ac:"#c9362b",h:"막대가 붉은 칸에 올 때 격발"},
 ["표적지 한가운데가 뻥 뚫렸다. 그날 대회 참가 신청이 두 배로 늘었다.","무난했다. 장병들이 예의 바르게 손뼉을 쳤다.","두 발이 표적 밖으로 날아갔다. ‘지휘관도 사람이다’라는 말이 부대에 돌았다."]),
Z("zf4","fo",8,8,"소원수리 분류","[19:00] 이번 달 소원수리함을 열었다. 쪽지마다 즉시 조치, 면담, 참고 중 하나로 나눈다.",
 {k:"rx",cat:["즉시 조치","면담","참고"],n:10,tl:[3200,2000],it:[["생활관 보일러 고장",0],["선임이 휴대폰을 뺏어 감",0],["부모님 건강이 걱정됨",1],["진로 상담을 받고 싶음",1],["PX에 새 과자 들여 주세요",2],["식당 반찬이 짜요",2],["화장실 문 잠금장치 고장",0],["요즘 잠을 잘 못 잠",1],["체육대회 종목 추가 건의",2],["당직 근무표가 불공평함",1]],h:"즉시·면담·참고로 나눈다"},
 ["쪽지마다 답이 달렸다. 다음 달 소원수리함은 절반으로 가벼워졌다.","몇 장은 다시 읽었지만 다 처리했다.","급한 쪽지 하나가 ‘참고’ 더미에 묻혔다. 일주일 뒤 그 일이 사고 보고서로 올라왔다."]),
Z("zf5","fo",9,9,"군악대 지휘","[11:00] 부대 창설 기념식. 군악대장이 지휘봉을 내민다. “지휘관님, 행진곡 한 곡 부탁드립니다.”",
 {title:"군악대 지휘",who:"군악대장",og:2,wl:"기립 박수",ll:"엇박 행진",wb:"군악대장의 말을 듣는다",lb:"지휘봉을 돌려준다",h:"노트가 분홍 선에 닿을 때 D·F·J·K",
  sen:["템포 유지!","금관 들어갑니다!","북 소리 맞춰!","좋습니다!","크레셴도!","행진 대열 들어옵니다!","마지막 마디!","피날레!"],me:["하나!","둘!","힘차게!","크게!","행진!","피날레!"],
  win:[["“지휘관님, 군악대로 오셔도 되겠습니다!”","내빈석의 노병 한 분이 일어나 경례를 했다. 행사 사진 중 그 장면이 제일 잘 나왔다."]],

Z("zf6","fo",9,9,"턱걸이 시범","[15:00] 전투 체력 대회 개막. 사회자가 갑자기 외친다. “지휘관님 턱걸이 시범 보시겠습니다!” 철봉 아래 장병 천 명.",
 {k:"ms",T:8000,per:6,dec:15,bt:"올라간다!",lab:"턱걸이 시범",col:"#e8c63a",gd:"#c2a86b",h:"연타해서 끝까지 버틴다"},
 ["열다섯 개. 내려오자 함성이 터졌고, 그날 턱걸이 종목 참가자가 세 배가 됐다.","여덟 개. 마지막 하나에서 얼굴이 시뻘게졌다. 병사들이 숫자를 큰 소리로 세 줬다.","세 개째에서 팔이 풀렸다. 사회자가 재빨리 ‘어깨 부상 투혼!’이라고 외쳤다."],

Z("zf7","fo",7,9,"분기 예산 집행","[16:00] 분기 예산 집행 점검. 남은 돈으로 생활관 보수와 훈련 물자를 다 맞춰야 한다. 군수 장교가 계산기를 놓고 갔다.",
 {k:"mt",u:"만 원",ti:"예산 집행",h:"맞는 금액을 고른다",qs:[()=>{const a=RI(12,20)*100,b=RI(3,8)*100;return[`남은 예산 ${WON(a)}만 원에서 보수비 ${b}만 원을 쓰면?`,a-b]},()=>{const k=[24,32,36,48][RI(0,3)],p=[15,18,25][RI(0,2)];return[`매트리스 ${k}개, 개당 ${p}만 원`,k*p]},()=>{const b=RI(3,5),x=[120,150,180][RI(0,2)];return[`훈련 물자비 ${b*x}만 원을 중대 ${b}곳에 똑같이`,x]}]},
 ["숫자가 한 번에 맞았다. 군수과장이 결산서를 넘겨보며 ‘이번 분기는 감사 걱정 없다’고 했다.","한 번 다시 계산했지만 맞췄다.","중대 하나 몫이 비었다. 그 중대 매트리스 교체는 다음 분기로 밀렸다."]),
Z("zf8","fo",7,9,"부대 부호 정리","[13:00] 지휘소 연습 준비. 상황도에 붙일 부대 부호 자석 열두 개가 한 상자에 쏟아져 있다. 같은 부호끼리 짝을 맞춰 정리해야 한다.",
 {k:"pr",it:["보병","기갑","포병","공병","통신","의무"],ti:"부대 부호",h:"같은 부호끼리 짝을 찾는다"},
 ["십 분 만에 정리했다. 그 상황도가 그대로 사단장 브리핑에 쓰였다.","두어 번 헷갈렸지만 시간 안에 붙였다.","포병 부호가 공병 자리에 붙어 있었다. 브리핑 도중 사단장이 그걸 짚었다."]),
Z("zf9","fo",7,9,"지휘소 이동","[02:00] 지휘소 이동 훈련. 야간에 도보로 새 지휘소 위치까지 가야 한다. 지도엔 피해야 할 오염 지역이 표시돼 있다.",
 {k:"mz",W:9,H:5,T:28000,fog:2,ex:"지휘소",sky:"#10141d",fl:"#232a38",wc:"#8f97ad",h:"◀ ▲ ▼ ▶로 새 지휘소까지"},
 ["예정보다 이십 분 일찍 통신망을 열었다. 상급 부대 평가관이 시간을 두 번 확인했다.","조금 늦었지만 통신망은 열었다.","오염 지역을 두 번 지나쳤다. 평가표에 ‘지휘소 요원 전원 화생방 피해’가 적혔다."]),
Z("zf10","fo",7,7,"작전 명령 초안","[08:30] 작전과장 첫 주. 작전 명령 초안을 받았는데 항목 순서가 뒤죽박죽이다. 다섯 개 항 순서대로 다시 배열해야 한다.",
 {k:"od",seq:["상황","임무","실시","전투근무지원","지휘 및 통신"],ti:"작전 명령 5개 항",par:5,h:"작전 명령 순서대로 누른다"},
 ["한 번에 맞췄다. 대대장이 초안을 그대로 하달했다.","한 번 순서를 바꿨다가 고쳤다.","‘임무’가 맨 뒤로 갔다. 대대장이 초안 첫 장에 빨간 줄을 그었다."]),
Z("zf11","fo",8,9,"지휘통제실 당직","[04:40] 지휘통제실 당직. 전방 관측소 보고가 연달아 올라온다. 진짜 도발 징후가 뜨면 즉시 대응 태세를 올리고, 헛것에는 움직이지 않아야 한다.",
 {k:"re",n:3,sig:["“총성 청취!”","“군사분계선 접근!”","“포성 청취!”"],wt:["“특이사항 없음”","“고라니 이동”","“특이사항 없음”","“바람에 철책 흔들림”"],ti:"지휘통제실",bt:"태세 격상!",gc:"#b83226",h:"진짜 징후가 뜨는 순간 누른다"},
 ["세 번 다 정확한 순간에 태세를 올렸다. 상급 부대 상황 평가에서 1등을 했다.","한 번은 늦었다. 평가는 보통.","‘고라니 이동’에 태세를 올렸다. 새벽 네 시에 부대 전체가 깼다."]),
Z("zf12","fo",7,9,"화력 요청","[10:00] 전술훈련 평가. 상황판에 표적 정보가 쏟아진다. 진짜 적만 골라 화력을 요청해야 한다. 오인 사격이 하나라도 나오면 평가 탈락이다.",
 {k:"wm",gd:["적 전차","적 포병","적 보병"],bd:["아군","민가","학교"],un:"적 표적",ti:"화력 요청",sky:"#141a24",gc:"#b03a2e",bc:"#4f7f5a",h:"적만 골라 누른다"},
 ["오인 사격 없이 평가를 마쳤다. 평가관 강평 첫 줄이 우리 부대였다.","몇 개를 놓쳤지만 오인 사격은 없었다.","민가에 화력을 요청했다. 평가관이 그 자리에서 훈련을 멈추고 상황판을 꺼 버렸다."]),
Z("zn18","nco",3,3,"주임원사 불시 순찰","[22:30] 소등 삼십 분 뒤 생활관 불시 순찰. 주임원사 완장을 찬 지 석 달째다. 손전등 하나로 열두 개 생활관을 돈다.",
 {k:"wm",gd:["전열기","담배꽁초","열린 총기함"],bd:["모포","전투화","관물대"],un:"위반",ti:"생활관 순찰",sky:"#10131c",gc:"#b03a2e",bc:"#2f4a5a",h:"규정 위반만 골라 누른다"},
 ["위반 물품만 정확히 걷어 왔다. 다음 날 아침 행보관들이 압수 목록을 보고 혀를 찼다.","몇 개는 놓쳤지만 전열기는 다 걷었다.","멀쩡한 전투화까지 걷어 왔다. 다음 날 병사들 사이에 ‘원사님 손전등’ 괴담이 돌았다."]),
Z("zn19","nco",2,3,"복지기금 결산","[17:00] 분기 복지기금 결산. 마지막 확인 서명은 내 몫이다. 경리 담당 하사가 영수증 상자를 놓고 퇴근했다.",
 {k:"mt",u:"만 원",ti:"복지기금 결산",h:"맞는 금액을 고른다",qs:[()=>{const a=RI(30,60),b=RI(10,25);return[`수입 ${a}만 원, 지출 ${b}만 원. 잔액은?`,a-b]},()=>{const n=RI(8,14),k=RI(2,5);return[`생활관 ${n}곳에 제습기 ${k}만 원씩`,n*k]},()=>{const n=[2,3,4,5][RI(0,3)],q=RI(10,25);return[`간식비 ${n*q}만 원을 중대 ${n}곳에 나누면`,q]}]},
 ["영수증 백열두 장이 원 단위까지 맞았다. 감사관이 결산서를 넘기다 볼펜을 내려놓았다.","두어 번 다시 계산했지만 결산은 맞췄다.","잔액이 이만 원 비었다. 경리 하사를 다시 불러 밤 열 시까지 영수증을 셌다."]),
Z("zf13","fo",7,8,"지휘소 이동","[05:10] 과학화전투훈련(KCTC) 둘째 날 새벽. 대항군 포병이 대대 지휘소 좌표를 잡았다는 무전이 들어왔다. 지휘 장갑차를 몰고 사격 구역을 빠져나가야 한다.",
 {k:"dg",ob:["포탄","포탄","포탄"],ti:"대항군 포격",sky:"#4f5a3a",c1:"#5b6640",c2:"#55603c",oc:"#c96a2b",T:13000,h:"◀ ▶로 포탄을 피한다"},
 ["지휘소는 한 번도 피격 판정을 받지 않았다. 대항군 연대장이 강평에서 ‘끝까지 못 잡았다’고 했다.","한 번 피격 판정을 받았지만 지휘는 이어졌다.","지휘소가 ‘전멸’ 판정을 받았다. 남은 훈련은 예비 지휘소가 넘겨받았다."]),
Z("zf14","fo",7,9,"파병 장비 선적","[10:00] 해외 파병 부대 출국 열흘 전, 부산항 부두. 부대 장비를 실은 컨테이너를 수송선에 올린다. 적재 순서와 위치는 파병 부대장인 내가 승인한다.",

Z("zg4","gen",10,12,"계급장 달아 주기","[10:00] 신병 수료식 내빈. 수료생 이백 명에게 직접 이병 계급장을 달아 주기로 했다. 행사 시간은 빠듯하다.",

Z("zg5","gen",12,13,"연합 작전 회의","[09:00] 연합훈련 최종 작전 회의. 동맹군 사령관이 질문을 쏟아낸다. 질문이 가리킨 작전 단계를 지도에서 차례로 짚어야 한다.",

Z("zg6","gen",12,12,"상황 보고 분류","[02:00] 상황실에 보고가 쏟아진다. 보고마다 즉시 보고, 조치 후 보고, 종합 보고 중 어디로 보낼지 정한다.",
 {k:"rx",cat:["즉시 보고","조치 후 보고","종합 보고"],n:10,tl:[3200,2000],sky:"#111522",it:[["철책 절단 흔적 발견",0],["탄약고 경보 오작동",1],["훈련 일정 변경",2],["총기 사고 발생",0],["차량 경미한 접촉",1],["급식 메뉴 변경",2],["미상 비행체 포착",0],["정전으로 비상 발전 가동",1],["체육대회 결과",2],["실종 병사 신고",0]],h:"보고 경로를 고른다"},
 ["새벽 상황이 하나도 안 꼬였다. 아침 회의에서 참모총장이 보고 체계를 따로 짚었다.","한두 건 보고가 늦었지만 큰 혼란은 없었다.","급한 보고 하나가 아침 종합 보고에 묻혔다. 국방부 전화가 먼저 왔다."]),

Z("zg8","gen",13,13,"위기 조치 결심","[04:20] 합참 지휘통제실. 미상 항적이 영공 가까이 접근한다. 단계마다 정확한 순간에 결심해야 한다.",

Z("zg9","gen",11,13,"예산 회의","[15:00] 국방부 예산 회의. 기획재정부가 사업 몇 개를 깎자고 한다. 숫자로 바로 받아치지 못하면 그대로 깎인다.",
 {k:"mt",u:"억 원",ti:"예산 회의",h:"맞는 금액을 고른다",qs:[()=>{const a=[2400,3600,4800][RI(0,2)],p=[10,15,20,25][RI(0,3)];return[`사업비 ${WON(a)}억 원에서 ${p}% 깎이면 남는 돈은?`,a-a*p/100]},()=>{const n=[120,150,180][RI(0,2)],c=[8,12,15][RI(0,2)];return[`장비 ${n}대, 대당 ${c}억 원`,n*c]},()=>{const y=RI(2,3),x=[150,200,300][RI(0,2)];return[`정비 예산 ${WON(y*x)}억 원을 ${y}년에 나눠 쓰면 한 해에?`,x]}]},
 ["숫자로 다 받아쳤다. 회의가 끝나고 기재부 과장이 명함을 두 장 줬다. 한 장은 자기 상사 거라고 했다.","한 건은 깎였지만 큰 사업은 지켰다.","숫자가 꼬였다. 회의록에 ‘국방부 추가 검토’가 세 번 적혔다."]),
Z("zg10","gen",12,13,"연합훈련 리셉션","[19:00] 다국적 연합훈련 개막 리셉션. 참가국 연락 장교 명패 열두 개가 테이블에 뒤섞였다. 같은 나라끼리 짝을 맞춰 자리를 정해야 한다.",

 ["리셉션이 제시간에 시작됐다. 호주 대표가 건배사에서 ‘한국 측 준비가 제일 빨랐다’고 했다.","한 자리는 바뀌었다. 영국 대표가 웃으며 옆자리로 옮겼다.","프랑스 대표가 캐나다 명패 앞에 앉았다. 통역 장교가 리셉션 내내 사과하고 다녔다."]),
Z("zg11","gen",10,12,"단상 좌석 배치","[08:00] 국군의 날 행사 준비. 단상 좌석표가 서열과 상관없이 뒤섞여 올라왔다. 행사 한 시간 전, 서열 순서대로 다시 앉혀야 한다.",
 {k:"od",seq:["국방부 장관","합참의장","육군참모총장","해군참모총장","공군참모총장","해병대사령관"],ti:"단상 서열",par:6,h:"서열이 높은 쪽부터 누른다"},
 ["서열이 한 번에 맞았다. 의전 장교가 그 좌석표를 다음 행사 견본으로 보관했다.","한 번 바꿔 앉혔다. 행사는 제시간에 시작했다.","해군참모총장이 공군참모총장 자리에 앉았다. 두 사람은 웃고 넘겼지만 의전 장교는 웃지 못했다."]),
Z("zg12","gen",11,12,"대포병 레이더","[05:10] 지휘통제실. 대포병 레이더가 탐지 신호를 띄운다. 진짜 포격이면 즉시 대응 사격을 승인해야 하고, 오탐에 대응하면 사고다.",
 {k:"re",n:3,sig:["“포격 탐지, 좌표 확인!”","“다연장 발사 탐지!”","“낙탄 확인!”"],wt:["“레이더 점검 중”","“새 떼 반사”","“기상 잡음”"],ti:"대포병 레이더",bt:"대응 사격 승인!",gc:"#b83226",h:"진짜 탐지만 누른다"},

Z("zg13","gen",12,13,"정전된 지휘소","[03:00] 전시 지휘소 훈련. 지하 지휘소가 정전됐다. 비상등만 깜빡이는 통로를 지나 지휘 통제실까지 가야 한다.",

 ["비상 발전기가 돌기 전에 통제실 자리에 앉았다. 연합 측 장성이 ‘지도 없이 왔냐’고 물었다.","한두 번 막다른 통로를 만났지만 도착했다.","통로에서 길을 잃었다. 부관이 무전으로 길을 불러 줬다. 훈련 기록에 그대로 남았다."]),
Z("zg14","gen",10,13,"지휘소 연습","[02:00] 지휘소 연습 사흘째 새벽. 대형 상황도 화면에 신호가 쉴 새 없이 뜬다. 참모들은 이틀째 제대로 못 잤다.",

Z("zg15","gen",11,13,"국방부 정문","[08:40] 훈련 사고 다음 날 아침, 국방부 정문. 기자 수십 명이 출입구 앞에 진을 쳤다. 공식 브리핑은 오후 두 시다. 지금은 차까지 가야 한다.",

Z("zg17","gen",11,11,"사단장 부임 첫날","[09:00] 사단장 부임 첫날, 첫 지휘관 회의. 예하 부대장들이 차례로 일어나 자기소개를 한다. 인사 기록 카드는 어젯밤에 다 외웠다.",

Z("zg18","gen",10,13,"지휘통제실 야간 대기","[03:40] 합참 지휘통제실 야간 대기. 대형 화면에 동해와 서해 감시 화면이 번갈아 뜬다. 탐지가 뜨면 장관과 청와대에 바로 보고가 올라가야 한다.",

Z("zg19","gen",10,11,"연합 작전계획 대조","[22:00] 연합 작전계획 개정안 서명 전날 밤. 한글본과 영문본의 부록 번호가 맞는지 직접 대조한다. 참모들은 먼저 퇴근시켰다.",

Z("zl2","pol",14,15,"악수 릴레이","[11:00] 지역 축제 개막식. 축사가 끝나자 주민들이 줄을 섰다. 다음 일정까지 이십 분.",

Z("zl7","pol",14,14,"민원 카드 정리","[19:00] 지역 사무실 민원의 날. 접수 카드가 책상에 산더미다. 같은 민원끼리 묶어야 담당 부서로 보낼 수 있다.",

Z("zl8","pol",14,15,"본회의 순서표","[13:50] 본회의 개의 십 분 전. 초선 의원 모임 간사를 맡았다. 의원들에게 돌릴 진행 순서표가 뒤섞여 인쇄됐다.",

Z("zl10","pol",14,15,"심야 토론","[22:00] 생방송 심야 토론. 상대 패널이 말을 끊고 들어온다. 너무 받아치면 싸움이 되고, 너무 물러서면 진다.",

   if(r()<.006){const up=r()<.5,mg=.05+r()*.07;ret+=up?mg:-mg;s.nw.push([d,up?0:1,(r()*5)|0])}
   const c=Math.max(50,RT(Math.min(hi,Math.max(lo,pc*Math.exp(ret))))),o=Math.max(50,RT(Math.min(hi,Math.max(lo,pc*Math.exp(sg*.35*NRM(r))))));
   let h=RT(Math.min(hi,Math.max(o,c)*Math.exp(Math.abs(sg*.5*NRM(r)))),Math.floor),l=RT(Math.max(lo,Math.min(o,c)*Math.exp(-Math.abs(sg*.5*NRM(r)))),Math.ceil);
   h=Math.max(h,o,c);l=Math.min(l,o,c);s.D.push([d,o,h,l,c,Math.round(q[7]*Math.exp(.35*NRM(r))*(1+25*Math.abs(ret)))]);s.c=c})}};
const SPX=i=>{MKG(S.d);return MK.S[i].c},
 SKV=()=>{const m=MS();let v=0;for(const k in m.sk)v+=m.sk[k][0]*SPX(+k);return v},

// ---- 봉급날: 봉급 → 적금 자동 납입 → 예금 이자 → 대출 상환 → 차 유지비
const LOAN=()=>{const m=MS(),L=m.ln,it=Math.round(L.p*L.r/12),need=L.n<=1?L.p+it:Math.min(L.m,L.p+it);
 if(m.c>=need){m.c-=need;L.p=Math.max(0,L.p-(need-it));L.n--;m.od=0;LOG("자동차 대출 상환",-need);if(L.p<1||L.n<=0){m.ln=null;return" 자동차 대출을 다 갚았다."}return` 대출 ${W(need)} 상환.`}
 const pd=m.c;m.c=0;if(pd)LOG("자동차 대출 일부 상환",-pd);L.p+=(pd>=it?-(pd-it):it-pd)+Math.round((need-pd)*.03);m.od++;S.mt=cl(S.mt-4);S.rp=cl(S.rp-1);   // 못 낸 이자·연체 가산금은 원금에 붙는다
 if(m.od>=3&&m.car){const v=CV(),nm=CARS[m.car.k][0];L.p-=v;m.car=null;m.cu=1;m.od=0;S.mt=cl(S.mt-15);S.rp=cl(S.rp-3);UL("seize");LOG(nm+" 압류",0);
  let t=` 석 달째 대출을 못 갚았다. 은행이 ${nm}${JO(nm,"을")} 압류해 ${W(v)}에 넘겼다.`;if(L.p<=0){m.c+=-L.p;m.ln=null;t+=" 대출은 그걸로 정리됐다."}else t+=` 남은 빚 ${W(L.p)}.`;return t}
 return` 대출 상환일, 잔고가 모자라 연체됐다(${m.od}개월째). 독촉 문자가 왔다.`};
const PAY=()=>{const m=MS(),p=GR(),D=DED(p),dd=D.reduce((a,q)=>a+q[1],0),net=p.g-dd,b0={hp:S.hp,mt:S.mt,rp:S.rp};
 m.c+=net;LOG(p.n,net);
 let x=`봉급날. ${p.n} ${W(p.g)}`+(dd?`에서 세금·연금·보험 ${W(dd)}을 떼고 ${W(net)}이 들어왔다.`:`이 그대로 들어왔다(병 봉급은 비과세).`);
 if(m.ln)x+=LOAN();   // 빚 → 차 유지비 → 적금 순서로 빠져나간다
 if(m.car){const u=CARS[m.car.k][4];if(m.c>=u){m.c-=u;m.cu=1;LOG("차 유지비(보험·기름값)",-u)}else{m.cu=0;S.mt=cl(S.mt-2);x+=" 차 유지비가 없어 차를 세워 뒀다."}}
 const v=m.sv;if(!S.nco&&v.st==1&&v.a>0){v.i+=v.p*.05/12;const a=Math.min(v.a,Math.floor(m.c/1e4)*1e4);if(a>=1e4){m.c-=a;v.p+=a;v.n++;LOG("장병내일준비적금 납입",-a);x+=` 적금 ${W(a)} 자동 납입${a<v.a?"(잔고만큼만)":""}.`}else x+=" 잔고가 모자라 이번 달 적금은 건너뛰었다."}
 if(m.dp>0){const it=Math.floor(m.dp*.028/12*(1-.154));if(it>0){m.dp+=it;LOG("일반 예금 이자(세후)",it)}}
 say(x);FXL(b0,S.dc);toast("봉급 +"+W(net));SFX("coin");RICH();
 if(!m.on&&!S.nco){m.on=1;OPEN("first",{f:1})}};

// ---- 매일: 봉급날 확인, PX 배부름 줄이기, 차 타는 즐거움, 채권 만기
const DAY=()=>{if(!ON())return;const m=MS(),t=CAL(S.d),k=t.getFullYear()*12+t.getMonth();
 if(m.fd!==S.d){const n=Math.max(1,Math.min(30,S.d-(m.fd|0)));m.fh*=Math.pow(.85,n);m.fm*=Math.pow(.85,n);m.fd=S.d}

 if(t.getDate()>=PDAY()&&m.pk<k){m.pk=k;PAY()}

 else if(/미터기 요금이/.test(t)){a=48000;r="복귀 택시비"}else if(/지갑이 가벼워졌다/.test(t)){a=10000;r="족구 내기"}
 if(a){const v=Math.min(a,m.c);m.c-=v;LOG(r,-v);HUD()}};

// ---- 화면 아래 지갑 막대

 const dis=!!S.mg||!!MW.o;b.querySelectorAll("button[data-w]").forEach(k=>{const x=k.dataset.w,off=dis||(x!="px"&&!PHONE());if(k.disabled!==off)k.disabled=off;k.title=off&&!dis?"훈련소에선 휴대폰을 쓸 수 없다":""});

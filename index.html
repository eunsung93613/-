  MW.o=o;MW.f=opt.f?1:0;MW.cb=opt.cb||null;MW.live=0;MW.cx=null;if(opt.tab)MW.tab=opt.tab;
  p.className="mwp mw-"+o;p.setAttribute("aria-label",{px:PXN(),bank:"은행",stock:"주식",car:"자동차",sav:"장병내일준비적금 만기",first:"첫 봉급"}[o]||"");w.hidden=false;document.body.classList.add("mwo");R();HUD();
  p.tabIndex=-1;setTimeout(()=>{try{p.focus({preventScroll:true})}catch(e){}},30)},   // 창 안으로 초점만 옮긴다(Tab으로 버튼에 간다)
 CLOSE=force=>{if(!MW.o||(MW.f&&!force))return;const o=MW.o,cb=MW.cb;
  if(o=="px"&&MW.rc&&MW.rc.n){const L=Object.entries(MW.rc.it).map(([k,v])=>k+(v>1?" "+v+"개":"")).join(", ");say(`${PXN()}에서 ${L}${JO(L,"을")} 샀다. (−${W(MW.rc.t)})`);FXL(MW.b0,S.dc);POP(MW.b0,S.dc)}
  MW.o="";MW.f=0;MW.cb=null;MW.live=0;MW.rc=null;MW.cx=null;const w=$("mw");if(w)w.hidden=true;document.body.classList.remove("mwo");
  try{MW.op&&MW.op.focus&&MW.op.focus({preventScroll:true})}catch(e){}MW.op=null;hud();if(cb)cb()};

// 공통 머리줄
const HEAD=(t,sub)=>`<header class="mwh"><h2 id="mwt">${t}</h2><span class="mww">지갑 <b>${W(MS().c)}</b></span>${MW.f?"":`<button type="button" class="mwx" data-a="x" aria-label="닫기">닫기</button>`}</header>${sub?`<p class="mwd">${sub}</p>`:""}`,
 TABS=(L,cur)=>`<div class="mwtb" role="tablist">${L.map(([k,t])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${k==cur}">${t}</button>`).join("")}</div>`,
 DL=L=>`<dl class="mwdl">${L.map(([a,b,c])=>`<div${c?` class="${c}"`:""}><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>`;

// ---- PX
const RPX=()=>{const m=MS(),tab=MW.tab=="pm"?"pm":"pf",L=PXI.map((q,i)=>[q,i]).filter(([q,i])=>tab=="pf"?i<7:i>=7),bar=v=>Math.round(Math.min(100,v/30*100));
 return HEAD(PXN(),`${POL()?"동네 편의점. 군 PX보다 훨씬 비싸다.":"부대 PX. 먹으면 체력, 씻고 바르면 멘탈이 오른다."} 같은 날 많이 살수록 효과가 준다.`)
  +`<div class="pxg"><span>배부름 <i><u style="width:${bar(m.fh)}%"></u></i></span><span>만족감 <i><u style="width:${bar(m.fm)}%"></u></i></span></div>`
  +TABS([["pf","먹거리 · 체력"],["pm","생필품 · 멘탈"]],tab)
  +`<ul class="pxl">${L.map(([q,i])=>{const h=EF(q[2],m.fh),t=EF(q[3],m.fm),pr=PXP(q);return`<li><b>${q[0]}</b><span>${[h?"체력 +"+h:"",t?"멘탈 +"+t:""].filter(Boolean).join(" · ")}</span><em>${W(pr)}</em><button type="button" data-a="pxb" data-i="${i}"${m.c<pr?" disabled":""}>사기</button></li>`}).join("")}</ul>`
  +(MW.rc&&MW.rc.n?`<p class="pxr">이번에 산 것 · ${Object.entries(MW.rc.it).map(([k,v])=>k+" "+v).join(", ")} · −${W(MW.rc.t)}</p>`:"")},
 PXB=i=>{const m=MS(),q=PXI[i],pr=PXP(q);if(m.c<pr){toast("잔액이 부족하다");return}
  const h=EF(q[2],m.fh),t=EF(q[3],m.fm);m.c-=pr;S.hp=cl(S.hp+h);S.mt=cl(S.mt+t);m.fh+=q[2];m.fm+=q[3];LOG(PXN()+" "+q[0],-pr);
  const rc=MW.rc||(MW.rc={n:0,t:0,it:{}});rc.n++;rc.t+=pr;rc.it[q[0]]=(rc.it[q[0]]|0)+1;SFX("coin");STATS();R()};

// ---- 자동차
const RCAR=()=>{const m=MS(),cur=m.car,sel=MW.ck;let h=HEAD("자동차",`차를 사면 행복도(멘탈)가 오르고, 차가 있는 동안 매일 조금씩 더 오른다. 매달 봉급날 보험·기름값이 나간다.${PHONE()?"":" 훈련소에선 살 수 없다."}`);
 if(cur){const q=CARS[cur.k];h+=`<section class="mwc"><h3>내 차 · ${q[0]}</h3>${DL([["사양",q[1]],["산 값",W(cur.p)],["지금 중고 시세",W(CV())],["월 유지비",W(q[4])+(m.cu?"":" · 미납, 운행 중지")],["행복도","매일 멘탈 +"+q[6]]])}<button type="button" data-a="csell">중고로 팔기 (+${W(CV())})</button></section>`}
 if(sel>=0){const q=CARS[sel],tax=CTAX(q),tr=cur?CV():0,tot=q[2]+tax-tr,sh=Math.max(0,tot-m.c),r=RATE(),lim=LIM();
  h+=`<section class="mwc sel"><h3>${q[0]} <small>${q[1]}</small></h3>`+DL([["차값",W(q[2])],["취득세",W(tax)+(q[7]?" (감면 적용)":"")],...(cur?[["타던 차 보상 판매","−"+W(tr)]]:[]),["필요한 돈",W(tot),"t"],["지갑",W(m.c)],["행복도","살 때 멘탈 +"+q[5]+" · 매일 +"+q[6]],["월 유지비",W(q[4])]]);
  if(sh>0){if(m.ln)h+=`<p class="mwn bad">돈이 ${W(sh)} 모자란다. 이미 대출이 있어 더 빌릴 수 없다.</p>`;
   else if(Math.ceil(sh/1e4)*1e4>lim)h+=`<p class="mwn bad">돈이 ${W(sh)} 모자란다. 대출 한도(${W(lim)})를 넘는다.</p>`;
   else{const P=Math.ceil(sh/1e4)*1e4,np=NETP(),mp=PMT(P,r,MW.ct),rt=Math.round((mp+q[4])/np*100);h+=`<p class="mwn">돈이 ${W(sh)} 모자란다. 모자란 만큼 자동차 대출을 받는다. 금리 연 ${(r*100).toFixed(1)}% · 한도 ${W(lim)}</p><p class="mwn${rt>50?" bad":""}">월 실수령 ${W(np)} 중 상환금+유지비 ${W(mp+q[4])} (${rt}%)${rt>50?" — 봉급날에 못 갚으면 연체되고, 석 달 밀리면 차를 압류당한다.":""}</p><div class="mwseg">${[12,24,36,60].map(n=>`<button type="button" data-a="cterm" data-n="${n}" aria-pressed="${MW.ct==n}">${n}개월<small>월 ${N0(PMT(P,r,n))}</small></button>`).join("")}</div><button type="button" class="mwgo" data-a="cbuy">대출 ${W(P)} 받고 산다</button>`}}
  else h+=`<button type="button" class="mwgo" data-a="cbuy">${W(tot)}에 산다</button>`;
  h+=`<button type="button" data-a="cback">목록으로</button></section>`}
 h+=`<ul class="crl">${CARS.map((q,i)=>`<li${i==sel?' class="on"':""}><div><b>${q[0]}</b><small>${q[1]} · 유지비 월 ${N0(q[4]/1e4)}만</small></div><div class="r"><b>${N0(q[2]/1e4)}만 원</b><small>행복도 +${q[5]}</small></div><button type="button" data-a="csel" data-i="${i}"${PHONE()?"":" disabled"}>보기</button></li>`).join("")}</ul>`;
 return h},
 CBUY=()=>{const m=MS(),k=MW.ck,q=CARS[k];if(k<0||!q)return;const tax=CTAX(q),tr=m.car?CV():0,tot=q[2]+tax-tr,sh=Math.max(0,tot-m.c),b0={hp:S.hp,mt:S.mt,rp:S.rp};
  let x="";if(sh>0){const P=Math.ceil(sh/1e4)*1e4,r=RATE(),n=MW.ct;if(m.ln||P>LIM())return toast("대출을 받을 수 없다");m.ln={p:P,r,n,m:PMT(P,r,n),t:n};m.c+=P;LOG("자동차 대출 실행",P);x=` 모자란 ${W(P)}은 ${n}개월 대출(연 ${(r*100).toFixed(1)}%, 월 ${W(m.ln.m)})로 채웠다.`}
  if(m.car){const on=CARS[m.car.k][0];m.c+=tr;LOG(on+" 보상 판매",tr);x=` 타던 ${on}${JO(on,"은")} ${W(tr)}에 넘겼다.`+x}
  m.c-=q[2]+tax;LOG(q[0]+" 구입(취득세 포함)",-(q[2]+tax));m.car={k,p:q[2],d:S.d};m.cu=1;S.mt=cl(S.mt+q[5]);UL("car");SFX("win");
  say(`${q[0]}${JO(q[0],"을")} 샀다. 차값 ${W(q[2])}에 취득세 ${W(tax)}.${x} 열쇠를 받아 든 손이 떨렸다.`);FXL(b0,S.dc);POP(b0,S.dc);MW.ck=-1;RICH();R()},
 CSELL=()=>{const m=MS();if(!m.car)return;const v=CV(),q=CARS[m.car.k],b0={hp:S.hp,mt:S.mt,rp:S.rp};m.c+=v;LOG(q[0]+" 중고 판매",v);m.car=null;m.cu=1;S.mt=cl(S.mt-2);say(`${q[0]}${JO(q[0],"을")} 중고로 ${W(v)}에 팔았다. 빈 주차 칸이 허전했다.`);FXL(b0,S.dc);POP(b0,S.dc);R()};

 else if(tab=="bs"){
  if(!S.nco){h+=`<section class="mwc"><h3>장병내일준비적금</h3><p class="mwn">매달 봉급날 자동 납입 · 연 5.0%(비과세) · 월 55만 원 한도 · 전역하면 넣은 원금만큼 정부가 한 번 더 준다(매칭지원금 100%). 부사관으로 임관해도 정리된다.</p>`;

   else h+=`<p class="mwl">매달 얼마씩 넣을까?</p>`;
   h+=`<div class="mwseg">${[5e4,1e5,2e5,3e5,4e5,55e4].map(a=>`<button type="button" data-a="sva" data-v="${a}" aria-pressed="${v.st==1&&v.a==a}">${a/1e4}만</button>`).join("")}</div>`;
   if(v.st==1)h+=`<button type="button" class="mwbad" data-a="svq">중도 해지 (원금 ${W(v.p)} + 이자 일부 · 매칭 없음)</button>`;h+=`</section>`}
  else{h+=`<section class="mwc"><h3>일반 예금</h3><p class="mwn">연 2.8%(세전) · 이자는 매달 봉급날 붙는다(이자소득세 15.4%). 언제든 넣고 뺄 수 있다.</p>`+DL([["예금 잔액",W(m.dp),"t"],["지갑",W(m.c)]])
   +`<p class="mwl">넣기</p><div class="mwseg">${[1e5,1e6,1e7].map(a=>`<button type="button" data-a="dpi" data-v="${a}"${m.c<a?" disabled":""}>+${N0(a/1e4)}만</button>`).join("")}<button type="button" data-a="dpi" data-v="-1"${m.c<1e4?" disabled":""}>전액</button></div>`
   +`<p class="mwl">빼기</p><div class="mwseg">${[1e5,1e6,1e7].map(a=>`<button type="button" data-a="dpo" data-v="${a}"${m.dp<a?" disabled":""}>−${N0(a/1e4)}만</button>`).join("")}<button type="button" data-a="dpo" data-v="-1"${m.dp<1?" disabled":""}>전액</button></div></section>`}}
 else if(tab=="bb"){const k=MW.bk,q=BNDS[k];
  h+=`<section class="mwc"><h3>채권 · 만기 6개월</h3><p class="mwn">부도 위험이 높을수록 상환됐을 때 돌려받는 돈이 크다. 만기 날 상환되면 원금과 이자(이자소득세 15.4% 공제)를 받고, 부도 나면 한 푼도 못 받는다.</p><ul class="bdl">`
   +BNDS.map((b,i)=>`<li${i==k?' class="on"':""}><button type="button" data-a="bsel" data-i="${i}"><span class="rk" style="--r:${b[0]}">${Math.round(b[0]*100)}%</span><b>${b[1]}<small>${b[2]} 등급</small></b><em>+${N0((BM(b[0])-1)*100)}%</em></button></li>`).join("")+`</ul>`
   +`<p class="mwl">${q[1]} · 부도 위험 ${Math.round(q[0]*100)}% · 상환되면 원금의 ${(BM(q[0])*100).toFixed(1)}%</p><div class="mwseg">${[1e5,5e5,1e6,5e6].map(a=>`<button type="button" data-a="bamt" data-v="${a}" aria-pressed="${MW.ba==a}">${N0(a/1e4)}만</button>`).join("")}</div>`
   +`<button type="button" class="mwgo" data-a="bbuy"${m.c<MW.ba||!PHONE()?" disabled":""}>${W(MW.ba)} 매수</button></section>`
   +`<section class="mwc"><h3>보유 채권</h3>${m.bd.length?`<ul class="mwlg">${m.bd.map(b=>`<li><span>D-${Math.max(0,b.d1-S.d)}</span><b>${BNDS[b.k][1]} (${Math.round(BNDS[b.k][0]*100)}%)</b><em>${W(b.a)}</em></li>`).join("")}</ul>`:`<p class="nbz">없다.</p>`}</section>`}
 else{if(m.ln){const L=m.ln;h+=`<section class="mwc"><h3>자동차 대출</h3>`+DL([["남은 원금",W(L.p),"t"],["금리","연 "+(L.r*100).toFixed(1)+"%"],["월 상환액",W(L.m)],["남은 기간",Math.max(0,L.n)+"개월 / "+L.t+"개월"],["연체",m.od?m.od+"개월째 (3개월이면 차 압류)":"없음"]])

 return h};

// ---- 장병내일준비적금 정리 창(부사관 임관·전역 때 자동으로 뜬다)
const RSAV=()=>{const v=MS().sv,tot=v.p*2+Math.round(v.i),why=MW.cb?"전역 날이다. 병으로 넣어 온 장병내일준비적금이 만기됐다.":"하사로 임관하면서 병 복무가 끝났다. 장병내일준비적금을 정리할 차례다.";
 return HEAD("장병내일준비적금 만기",why)+DL([["납입 원금",W(v.p)+" ("+v.n+"개월)"],["이자(연 5.0%, 비과세)",W(v.i)],["정부 매칭지원금(100%)",W(v.p)],["받을 돈",W(tot),"t"]])
